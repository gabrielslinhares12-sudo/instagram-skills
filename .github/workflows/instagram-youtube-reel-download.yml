name: Importar YouTube Short TUE via link (sem publicar)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-youtube-reel-download.yml'
      - 'scripts/instagram_download_approved_tue_short.py'
      - 'scripts/test_instagram_download_approved_tue_short.py'

permissions:
  contents: read

concurrency:
  group: tue-download-short-link-02nov-fallback-tests
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testes offline de URL, identidade e formato
        run: python -m unittest discover -s scripts -p 'test_instagram_download_approved_tue_short.py' -v
      - name: Verificar FFprobe
        run: ffprobe -version | head -n 1
      - name: Baixar video por URL via site publico (somente MP4 do canal)
        run: python scripts/instagram_download_approved_tue_short.py
      - name: Preservar MP4 e relatorio somente em Actions Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tue-youtube-reel-02nov
          path: output/youtube-reel-import/
          if-no-files-found: warn
          retention-days: 7
