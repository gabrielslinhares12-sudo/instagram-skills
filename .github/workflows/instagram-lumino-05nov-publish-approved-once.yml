name: TUE 05NOV - publicar carrossel Lúmino aprovado uma única vez
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-lumino-05nov-publish-approved-once.yml'
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  publish-six-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
    steps:
      - name: Checkout safe main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation and conversion
        run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
      - name: Validate main publishing script and existing Meta components
        run: |
          python -m py_compile scripts/instagram_lumino_nov05_publish_once.py scripts/instagram_queue.py scripts/facebook_poster.py
          python -m unittest discover -s scripts -p 'test_instagram_queue.py' -q
      - name: Download exact six owner-approved images and publish ONLY this carousel
        run: python -u scripts/instagram_lumino_nov05_publish_once.py
      - name: Preserve upload and official publication receipt for safe review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumino-origin-05nov-publication-audit-${{ github.run_id }}
          path: |
            content/media/instagram/2026-11-05/LUMINO-ORIGEM-APROVADO/MANIFEST.json
            content/publication-state.json
          if-no-files-found: warn
          retention-days: 14
