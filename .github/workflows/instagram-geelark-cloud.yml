name: Instagram TUE - carrossel com musica por Android cloud GeeLark

# Controle de nuvem: não requer runner GUTHY, PC ou Android local.
# Este workflow NÃO publica diretamente sem aceite das condições de segurança.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-geelark-cloud.yml'
      - 'scripts/instagram_geelark_cloud.py'
      - 'scripts/test_instagram_geelark_cloud.py'
      - 'scripts/configurar_geelark_cloud.sh'
      - 'content/geelark-task-state.json'
      - 'content/geelark-music-plan.json'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=seguro sem publicar; submit=agendar na nuvem; reconcile=consultar tarefa'
        type: choice
        options: [check, submit, reconcile]
        default: check
        required: true
      post_id:
        description: 'Identificador exato de um carrossel aprovado'
        type: string
        default: 'halloween-2026-10-31-historia-8-laminas'
        required: true
      schedule_utc:
        description: 'Data futura em UTC: 2026-11-03T15:00:00Z'
        type: string
        required: false
      music_source_url:
        description: 'URL publica de Reel/Post do Instagram com audio aprovado'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  native_cloud_music:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.GEELARK_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: write
    steps:
      - name: Buscar fila canonica e historico duravel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testes offline das travas e do formato carrossel
        run: |
          python3 -m unittest discover -s scripts -p 'test_instagram_geelark_cloud.py' -v
          bash -n scripts/configurar_geelark_cloud.sh
      - name: Verificar padrão editorial e imagens antes da operação
        run: |
          python3 -m pip install 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py verify-assets
          python3 scripts/instagram_visual_standard.py audit-queue
      - name: Configurar identidade do registro no Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Executar modo seguro ou agendar tarefa explicita
        env:
          MODE: ${{ github.event_name == 'schedule' && 'auto' || github.event_name == 'push' && 'check' || inputs.mode || 'check' }}
          POST_ID: ${{ inputs.post_id || 'halloween-2026-10-31-historia-8-laminas' }}
          SCHEDULE_UTC: ${{ inputs.schedule_utc }}
          MUSIC_SOURCE_URL: ${{ inputs.music_source_url }}
          GEELARK_TOKEN: ${{ secrets.GEELARK_TOKEN }}
          GEELARK_PHONE_ID: ${{ vars.GEELARK_PHONE_ID }}
          GEELARK_PUBLISH_ENABLED: ${{ vars.GEELARK_PUBLISH_ENABLED || 'false' }}
          GEELARK_ACCOUNT_CONFIRMED: ${{ vars.GEELARK_ACCOUNT_CONFIRMED || 'false' }}
          GEELARK_COST_APPROVED: ${{ vars.GEELARK_COST_APPROVED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "auto" ]; then
            python3 scripts/instagram_geelark_cloud.py auto
            python3 scripts/instagram_geelark_cloud.py reconcile
          elif [ "$MODE" = "reconcile" ]; then
            python3 scripts/instagram_geelark_cloud.py reconcile
          elif [ "$MODE" = "submit" ]; then
            python3 scripts/instagram_geelark_cloud.py submit \
              --post-id "$POST_ID" \
              --schedule-at "$SCHEDULE_UTC" \
              --music-url "$MUSIC_SOURCE_URL"
          else
            python3 scripts/instagram_geelark_cloud.py check \
              --post-id "$POST_ID" \
              --schedule-at "$SCHEDULE_UTC" \
              --music-url "$MUSIC_SOURCE_URL"
          fi
      - name: Guardar recibo de tarefa sem segredos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-geelark-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: content/geelark-task-state.json
          retention-days: 7
