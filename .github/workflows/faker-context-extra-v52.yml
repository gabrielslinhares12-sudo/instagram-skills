name: "FAKER EP01 — additional licensed Korean city and authentic gaming b-roll (PRIVATE)"
on:
  push:
    branches: [experimental/faker-ep01-openmontage-v49]
    paths: ['.github/workflows/faker-context-extra-v52.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q requests
      - name: Ingest short Pexels licensed documentary context shots
        run: |
          mkdir -p context_extra
          cat > /tmp/context.py <<'PY'
          import concurrent.futures,subprocess,urllib.request,urllib.error,json,pathlib
          out=pathlib.Path('context_extra')
          rows=[
           ('seoul_night_timelapse_a','26690703','uhd_3840_2160_30fps','Real Seoul skyline and night traffic'),
           ('seoul_night_timelapse_b','26690702','uhd_3840_2160_30fps','Real Seoul aerial traffic'),
           ('gaming_keyboard_2026','40192942','hd_1920_1080_30fps','Generic gamer fingers on keyboard, non-Faker'),
           ('gaming_pc_lights','1957727','hd_1920_1080_30fps','Generic PC station, non-Faker'),
           ('gaming_keyboard_typing','40192954','hd_1920_1080_30fps','Generic mechanical keyboard, non-Faker'),
           ('gaming_setup_rgb','29065068','uhd_3840_2160_24fps','Generic RGB gaming setup'),
           ('esports_players_talking','9071412','hd_1920_1080_25fps','Generic esports competition, not T1'),
           ('gaming_mouse_keyboard','9070651','hd_1920_1080_25fps','Generic esports gamer hands, not Faker'),
           ('seoul_night_road','4191314','hd_1920_1080_30fps','Real Seoul night road'),
           ('seoul_intersection_night','26690701','hd_1920_1080_30fps','Real Seoul night intersection'),
           ('night_traffic_vertical','11867212','hd_1080_1920_30fps','Generic night traffic, not Seoul-specific')
          ]
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36'}
          def fetch(x):
            name,vid,size,meaning=x
            rec={'name':name,'pexels_id':vid,'source_page':'https://www.pexels.com/video/'+vid+'/','content_meaning':meaning,'license':'Pexels free license; rights still require compliance'}
            dl='https://www.pexels.com/download/video/'+vid+'/'
            links=[]
            try:
              q=urllib.request.Request(dl,headers=h)
              with urllib.request.urlopen(q,timeout=18) as r:
                final=r.geturl()
                links.append(final)
            except Exception as e:rec['download_redirect_error']=str(e)[:180]
            links.append(f'https://videos.pexels.com/video-files/{vid}/{vid}-{size}.mp4')
            seen=set()
            for u in links:
              if u in seen:continue
              seen.add(u)
              if not u.startswith('https://videos.pexels.com/'):continue
              temp=out/(name+'.mp4')
              filt='scale=720:1280:force_original_aspect_ratio=increase:flags=bicubic,crop=720:1280,setsar=1,fps=24,format=yuv420p'
              cmd=['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y','-user_agent',h['User-Agent'],'-ss','0','-i',u,'-t','6','-vf',filt,'-an','-c:v','libx264','-preset','ultrafast','-crf','27',str(temp)]
              try:
                z=subprocess.run(cmd,capture_output=True,timeout=70)
                if z.returncode==0 and temp.exists() and temp.stat().st_size>10000:
                  rec['status']='DOWNLOADED_LICENSED_CONTEXT';rec['bytes']=temp.stat().st_size;rec['origin_url']=u
                  print(name,'OK',rec['bytes'],flush=True)
                  return rec
                rec['last_error']=z.stderr[-220:].decode(errors='replace')
              except Exception as e:rec['last_error']=str(e)
              temp.unlink(missing_ok=True)
            rec['status']='FAILED';print(name,'FAILED',rec.get('last_error'),flush=True)
            return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: a=list(pool.map(fetch,rows))
          (out/'SOURCE_AUDIT.json').write_text(json.dumps(a,ensure_ascii=False,indent=2))
          PY
          python3 /tmp/context.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faker-v52-context-extra-video
          path: context_extra/
          retention-days: 3
          compression-level: 0
