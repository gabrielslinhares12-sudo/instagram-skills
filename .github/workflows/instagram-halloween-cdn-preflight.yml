name: Instagram TUE - validar origem alternativa Halloween sem enviar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-halloween-cdn-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testar todos os oito JPEGs originais no CDN com SHA256
        run: python3 scripts/instagram_halloween_cdn_preflight.py
