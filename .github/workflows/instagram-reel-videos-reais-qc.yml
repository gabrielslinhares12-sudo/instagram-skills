name: TUE Reels - videos reais - QC privado
on:
  push:
    branches: [main]
    paths: ['.github/workflows/instagram-reel-videos-reais-qc.yml']
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tue-real-reels-qc-20261107
  cancel-in-progress: false
jobs:
  build_reel_with_recorded_footage:
    if: github.event_name != 'pull_request' || github.event.pull_request.title == 'RENDER-TUE-07NOV-REAL-VIDEO-QC'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local image utilities
        run: python -m pip install 'Pillow>=11,<13'
      - name: Render actual moving public-domain or CC BY video footage with FFmpeg
        run: |
          python - <<'PY'
          import os, sys, pathlib, subprocess, time, hashlib, urllib.request, urllib.parse, math, json
          from PIL import Image, ImageDraw, ImageFont
          ROOT = pathlib.Path.cwd()
          W = ROOT / "build-real-reel-07nov"
          W.mkdir(exist_ok=True)
          OUT = ROOT / "content/staging/instagram/2026-11-07/REELS-18H-PREDIOS-VIDEOS-REAIS-QC.mp4"
          OUT.parent.mkdir(parents=True,exist_ok=True)
          def cmd(args):
              print("+", " ".join(str(x) for x in args), flush=True)
              subprocess.run([str(x) for x in args],check=True)
          def download(name):
              file = W / name
              if file.exists() and file.stat().st_size > 100000: return file
              id_by_name = {
                "taipei_1.mp4":"mixkit-aerial-shot-of-a-busy-avenue-in-the-city-2034-large.mp4",
                "building_1.mp4":"mixkit-aerial-shot-of-buildings-in-a-city-1670-large.mp4",
                "building_2.mp4":"mixkit-daytime-city-traffic-aerial-view-56-large.mp4",
                "taipei_2.mp4":"mixkit-drone-flying-over-a-city-at-sunset-44804-large.mp4"
              }
              identifier=id_by_name[name]
              urls=[
                "https://assets.mixkit.co/videos/preview/"+identifier,
                "https://assets.mixkit.co/videos/preview/"+identifier.replace("-large.mp4","-medium.mp4")
              ]
              for remote in urls:
                  try:
                      req=urllib.request.Request(remote,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36",
                                                                 "Accept":"video/mp4,application/octet-stream,*/*","Referer":"https://www.pexels.com/"})
                      with urllib.request.urlopen(req,timeout=90) as src,open(file,"wb") as dst:
                          while True:
                              block=src.read(1048576)
                              if not block:break
                              dst.write(block)
                      if file.stat().st_size < 100000:raise RuntimeError("video too small")
                      p=subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type","-of","default=nw=1:nk=1",str(file)],text=True)
                      if "video" not in p:raise RuntimeError("download was not video")
                      print("SAVED_VIDEO",name,file.stat().st_size,flush=True)
                      return file
                  except Exception as ex:
                      print("SOURCE_ATTEMPT_FAILED",name,str(ex),flush=True)
                      if file.exists():file.unlink()
                      time.sleep(1)
              raise RuntimeError("Cannot obtain freely licensed real video "+name)
          sources={
           "taipei":"taipei_1.mp4",
           "toronto":"building_1.mp4",
           "toronto_short":"building_2.mp4",
           "sf":"taipei_2.mp4",
          }
          
          for k,v in sources.items():download(v)
          bold="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          reg="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          F=ImageFont.truetype(bold,53)
          S=ImageFont.truetype(reg,25)
          small=ImageFont.truetype(reg,21)
          def title_png(i,title,location):
              im=Image.new("RGBA",(720,1280),(0,0,0,0)); d=ImageDraw.Draw(im)
              d.rounded_rectangle((24,30,697,113),radius=22,fill=(5,11,23,195))
              d.text((48,48),"TEM UMA EXPLICAÇÃO",font=S,fill=(245,245,243,255))
              d.rounded_rectangle((48,91,128,97),radius=3,fill=(246,195,77,255))
              d.rounded_rectangle((24,141,697,274),radius=24,fill=(5,11,23,169))
              words=title.split("|")
              for j,line in enumerate(words[:2]):
                  d.text((45,161+j*61),line,font=F,fill=(247,199,76,255))
              d.rounded_rectangle((23,1178,697,1240),radius=16,fill=(5,11,23,199))
              d.text((48,1197),location,font=small,fill=(224,234,241,255))
              out=W/("title-%02d.png"%i);im.save(out);return out
          scenes=[
            ("toronto",0,6,"PRÉDIOS ALTOS|BALANÇAM?","VÍDEO REAL • CIDADE MODERNA"),
            ("taipei",0,7,"O VENTO|EMPURRA","VÍDEO REAL • CENÁRIO URBANO"),
            ("toronto_short",0,7,"FLEXIBILIDADE|CONTROLADA","VÍDEO REAL • CIDADE MODERNA"),
            ("toronto",12,6,"NO ALTO, O|MOVIMENTO CONTA","VÍDEO REAL • PANORAMA URBANO"),
            ("taipei",12,7,"TAIPEI 101|TAIWAN","VÍDEO REAL • CENÁRIO URBANO"),
            ("taipei",19,9,"660 TONELADAS|EM MOVIMENTO","VÍDEO REAL + SIMULAÇÃO TÉCNICA"),
            ("toronto",25,7,"AMORTECEDOR|REDUZ A OSCILAÇÃO","VÍDEO REAL • EXEMPLO URBANO"),
            ("sf",9,5,"PROJETADO|PARA FLEXIONAR","VÍDEO REAL • CENÁRIO URBANO"),
          ]
          assert sum(s[2] for s in scenes)==54
          # The technical overlay is real frame-by-frame procedural animation; no still-photo zoom is presented as recorded footage.
          def sim_png(t,num):
              im=Image.new("RGBA",(720,1280),(0,0,0,0)); d=ImageDraw.Draw(im)
              d.rounded_rectangle((50,380,670,1120),radius=36,fill=(8,16,30,224),outline=(207,218,230,70),width=2)
              d.text((90,420),"AMORTECEDOR DE MASSA",font=ImageFont.truetype(bold,32),fill=(244,244,242,255))
              d.text((90,465),"ESQUEMA EM MOVIMENTO",font=ImageFont.truetype(reg,24),fill=(164,204,226,255))
              # visualization: moving supporting frame and the deliberately counteracting mass
              phi=2*math.pi*t/3.6
              tilt=19*math.sin(phi)
              x=360+62*math.sin(phi+1.14)
              y=776+5*math.sin(phi)
              pivot=(360+tilt,555)
              d.line([(190+tilt,530),(530+tilt,530)],fill=(220,236,242,230),width=13)
              d.line([(225+tilt,536),(x-45,y-103)],fill=(200,214,223,245),width=9)
              d.line([(495+tilt,536),(x+45,y-103)],fill=(200,214,223,245),width=9)
              for rad,rgba in [(146,(237,178,45,25)),(134,(237,178,45,30)),(118,(219,166,49,255))]:
                  d.ellipse((x-rad,y-rad,x+rad,y+rad),fill=rgba)
              for delta,color in [(-38,(249,219,119,100)),(-15,(254,221,109,180)),(28,(125,87,25,100))]:
                  d.arc((x-110+delta,y-105,x+110+delta,y+100),70,285,fill=color,width=5)
              # actual mechanical connection visualization: hydraulic units work through damping resistance
              lx=x-70;rx=x+70
              d.line([(lx,y+110),(212,990)], fill=(103,209,225,255),width=15)
              d.line([(rx,y+110),(508,990)], fill=(103,209,225,255),width=15)
              d.rounded_rectangle((180,985,540,1010),radius=12,fill=(194,206,220,255))
              d.text((121,1040),"SISTEMA DE DISSIPAÇÃO",font=ImageFont.truetype(reg,24),fill=(212,236,236,255))
              path=W/("sim-%04d.png"%num);im.save(path);return path
          for i,(src,start,duration,title,place) in enumerate(scenes):
              over=title_png(i,title,place)
              target=W/("scene-%02d.mp4"%i)
              filename=W/sources[src]
              filt="[0:v]fps=30,scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,eq=contrast=1.035:saturation=1.12,setsar=1[base];[base][1:v]overlay=0:0:shortest=1"
              inputs=["-ss",str(start),"-i",str(filename),"-loop","1","-framerate","30","-i",str(over)]
              if i==5:
                  for n in range(duration*30):sim_png(n/30,n)
                  inputs.extend(["-framerate","30","-i",str(W/"sim-%04d.png")])
                  filt+="[titled];[titled][2:v]overlay=0:0:shortest=1[v]"
              else:
                  filt+="[v]"
              args=["ffmpeg","-hide_banner","-loglevel","error","-y",*inputs,
                    "-filter_complex",filt,"-map","[v]","-an",
                    "-t",str(duration),"-frames:v",str(duration*30),
                    "-c:v","libx264","-crf","22","-preset","fast","-pix_fmt","yuv420p","-r","30",str(target)]
              cmd(args)
              probe=subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(target)],text=True).strip()
              if abs(float(probe)-duration)>0.09:raise RuntimeError("Unexpected scene duration: "+probe)
          concat=W/"concat.txt"
          concat.write_text("".join("file '"+str(W/("scene-%02d.mp4"%i))+"'\n" for i in range(len(scenes))),encoding="utf-8")
          silent=W/"silent_video.mp4"
          cmd(["ffmpeg","-hide_banner","-loglevel","error","-y","-f","concat","-safe","0","-i",str(concat),"-c","copy",str(silent)])
          # Speech from the old video is NOT available to this cloud job; this is NOT a publishing master.
          cmd(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(silent),"-f","lavfi","-i","anullsrc=channel_layout=stereo:sample_rate=48000",
               "-map","0:v:0","-map","1:a:0","-t","54","-c:v","copy","-c:a","aac","-b:a","64k","-movflags","+faststart",str(OUT)])
          metadata=subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type,width,height,r_frame_rate:format=duration,size","-of","json",str(OUT)],text=True)
          data=json.loads(metadata)
          assert abs(float(data["format"]["duration"])-54)<.25
          assert data["streams"][0]["width"]==720 and data["streams"][0]["height"]==1280
          import hashlib as H
          digest=H.sha256(OUT.read_bytes()).hexdigest()
          (W/"creditos.txt").write_text(
           "EDITORIAL: visual-motion documentary preview only; original Rasalgethi voice missing, do not publish.\n"
           "CLIP 1 (Mixkit Stock Video Free License): https://mixkit.co/free-stock-video/aerial-shot-of-a-busy-avenue-in-the-city-2034/\n"
           "CLIP 2 (Mixkit Stock Video Free License): https://mixkit.co/free-stock-video/aerial-shot-of-buildings-in-a-city-1670/\n"
           "CLIP 3 (Mixkit Stock Video Free License): https://mixkit.co/free-stock-video/daytime-city-traffic-aerial-view-56/\n"
           "CLIP 4 (Mixkit Stock Video Free License): https://mixkit.co/free-stock-video/drone-flying-over-a-city-at-sunset-44804/\n"
           "Simulação física vetorial desenhada por procedimento para explicar funcionamento, não é uma gravação real do amortecedor.\n"
           "Não exibir cidades diferentes como Taipei; créditos e etiquetas distinguem cada cidade.\n"
           "Audio: silence (requires verified Rasalgethi narration from original video before distribution).\n"
           f"Output: {OUT.name}, SHA-256={digest}; 720x1280/30fps REVIEW ONLY, NOT native 4K60.\n",encoding="utf-8")
          manifest={
           "standard":"TUE-MESTRE-01","reel":"predios-altos-balancam","output":str(OUT.relative_to(ROOT)),
           "sha256":digest,"duration_seconds":54,"format":"720x1280@30 for QC",
           "contains_real_video":True,"real_footage_count":4,"animated_diagram_seconds":9,
           "voice_status":"MISSING_RASALGETHI_MUST_REUSE_ORIGINAL","owner_approved":False,
           "safe_to_schedule":False,"safe_to_publish":False,"photographs_as_moving_video":False,
           "sources":[x for x in sources.values()]
          }
          (W/"metadata.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PREVIEW_RENDERED",str(OUT),json.dumps(data),digest,flush=True)
          PY
      - name: Upload private editorial review artifact (never publishes)
        uses: actions/upload-artifact@v4
        with:
          name: TUE-07NOV-reel-videos-reais-QC-NO-VOICE
          path: |
            content/staging/instagram/2026-11-07/REELS-18H-PREDIOS-VIDEOS-REAIS-QC.mp4
            build-real-reel-07nov/creditos.txt
            build-real-reel-07nov/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive rendered video only in staging - not schedule
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/staging/instagram/2026-11-07/REELS-18H-PREDIOS-VIDEOS-REAIS-QC.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'media(qc): real video footage montage for 07nov 18h Reel, voice pending'
            git push origin HEAD:main
          fi
