name: Importar mídias da semana do Instagram (execução única)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-tue-week-import-2026-10-31
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Identify GitHub Actions commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rebuild original ZIP from immutable verified Git blobs
        run: |
          mkdir -p content/uploads
          cat content/uploads/chunks/instagram-tue-semana-2026-10-31.part?? > content/uploads/instagram-tue-semana-2026-10-31-06nov.zip
          test "$(wc -c < content/uploads/instagram-tue-semana-2026-10-31-06nov.zip)" -eq 13777509
          python3 - <<'PY'
          from zipfile import ZipFile
          p="content/uploads/instagram-tue-semana-2026-10-31-06nov.zip"
          with ZipFile(p) as z:
              assert z.testzip() is None, "Corrupted ZIP entry"
              assert len([i for i in z.namelist() if i.endswith('.jpg') or i.endswith('.mp4')]) == 27
          print("ZIP reconstructed: 13,777,509 bytes, 27 intact media items")
          PY
      - name: Verify ZIP and extract all 27 final media files
        run: python3 scripts/importar_semana_zip.py extract
      - name: Commit and push immutable binary media
        run: |
          git add -- content/media/semana-2026-10-31-final/
          git commit -m 'Import 27 final verified Instagram Lúmino media'
          git push origin HEAD:main
      - name: Update schedule with pinned media URLs but do not approve
        run: |
          MEDIA_COMMIT="$(git rev-parse HEAD)"
          python3 scripts/importar_semana_zip.py finalize --media-commit "$MEDIA_COMMIT"
          git add -- content/schedule.json
          git commit -m 'Reference final Instagram media by immutable commit, keep all posts unapproved'
          git push origin HEAD:main
      - name: Record final media import validation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('content/schedule.json').read_text(encoding='utf-8'))
          items=s['posts']
          assert len(items)==7
          assert sum(len(p['media_urls']) for p in items)==27
          assert all(not p['approved'] for p in items)
          assert all('PENDENTE' not in u for p in items for u in p['media_urls'])
          print('IMPORTED: 27 assets, 7 posts, all approvals disabled, no scheduled background publishing.')
          PY
