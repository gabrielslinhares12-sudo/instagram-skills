name: TUE - excluir somente artefatos com backup Drive verificado SHA256
on:
  push:
    branches: [main]
    paths:
      - 'content/artifact-cleanup/drive_verified.json'
      - 'scripts/after_drive_cleanup.py'
      - 'scripts/test_artifact_cleanup_after_drive.py'
      - '.github/workflows/verified-drive-artifact-cleanup.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Conferir todos os hashes sem apagar arquivos'
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: tue-drive-verified-artifact-cleanup
  cancel-in-progress: false
jobs:
  verify-and-clean:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validar regras de seguranca antes de toda verificacao
        run: |
          python -m unittest scripts/test_artifact_cleanup_after_drive.py -v
          python -m py_compile scripts/after_drive_cleanup.py
      - name: Verificar copia Drive e SHA256 antes de remover artefato
        env:
          GH_TOKEN: ${{ github.token }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERIFY_ONLY" == "true" ]]; then
            python scripts/after_drive_cleanup.py --max-artifacts 20
          else
            python scripts/after_drive_cleanup.py --apply --max-artifacts 20
          fi
      - name: Registrar politica segura, sem upload de artefatos
        if: always()
        shell: bash
        run: |
          echo 'Somente IDs permitidos pelo manifesto; ambos os ZIPs verificados por SHA256.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sem limpeza de releases, Drive, GUTHY, publicacao-state, workflows ou media sem comprovante.' >> "$GITHUB_STEP_SUMMARY"