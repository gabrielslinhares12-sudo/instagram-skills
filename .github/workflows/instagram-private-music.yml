name: Instagram TUE — carrossel com música (método móvel experimental)

# A API móvel não oficial pode causar desafios de login/limitações na conta.
# Totalmente desligada até aceite de risco, sessão e aprovação editorial.
on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verificar compatibilidade sem publicar (padrão)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  private_music:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.INSTAGRAM_PRIVATE_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verificar pré-condições locais, sem sessão
        run: python3 -m unittest discover -s scripts -p test_instagram_private_*.py -v
      - name: Confirmar identidade editorial e evitar publicação dupla
        run: |
          python3 -m pip install 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py verify-assets
          python3 scripts/instagram_visual_standard.py audit-queue
      - name: Executar apenas publicações explicitamente autorizadas
        env:
          PRIVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          INSTAGRAM_PRIVATE_PUBLISH_ENABLED: ${{ vars.INSTAGRAM_PRIVATE_PUBLISH_ENABLED || 'false' }}
          INSTAGRAM_PRIVATE_RISK_ACCEPTED: ${{ vars.INSTAGRAM_PRIVATE_RISK_ACCEPTED || 'false' }}
          INSTAGRAM_PRIVATE_SESSION_B64: ${{ secrets.INSTAGRAM_PRIVATE_SESSION_B64 }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$PRIVATE_DRY_RUN" = 'true' ]; then
            python3 scripts/instagram_private_music.py --dry-run
          else
            if [ "$INSTAGRAM_PRIVATE_PUBLISH_ENABLED" != 'true' ] || [ "$INSTAGRAM_PRIVATE_RISK_ACCEPTED" != 'true' ]; then
              echo 'Método móvel experimental desativado; nenhum envio realizado.'
              exit 0
            fi
            # Isolado do validador Pillow 11 da identidade da marca.
            python3 -m pip install 'instagrapi>=3.2,<4' 'Pillow>=13,<14'
            python3 scripts/instagram_private_music.py --execute
          fi
      - name: Guardar recibo/estado da publicação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-private-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 14
