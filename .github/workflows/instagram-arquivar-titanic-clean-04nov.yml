name: Arquivar Reel Titanic vertical 4K60 04NOV - sem publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-arquivar-titanic-clean-04nov.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tue-titanic-04nov-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Install video inspection tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fetch exact 4K60 final, probe and make cover
        shell: bash
        run: |
          set -euo pipefail
          DIR=content/media/instagram/2026-11-04/titanic-vertical-4k60
          mkdir -p "$DIR"
          VIDEO="$DIR/REEL-TITANIC-VERTICAL-CLEAN-4K60.mp4"
          COVER="$DIR/CAPA-TITANIC-VERTICAL-4K.jpg"
          curl -fsSL --retry 3 --retry-all-errors --max-time 480 \
            'https://gcdn.picsart.com/media-engine/01b27b79-0662-47a0-8116-79ec47aa04d0.mp4' -o "$VIDEO"
          test "$(stat -c%s "$VIDEO")" -gt 30000000
          test "$(stat -c%s "$VIDEO")" -lt 99999999
          python3 - <<'PY'
          import json,subprocess,pathlib
          p=pathlib.Path('content/media/instagram/2026-11-04/titanic-vertical-4k60/REEL-TITANIC-VERTICAL-CLEAN-4K60.mp4')
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate','-of','json',str(p)],text=True))
          video=[x for x in d['streams'] if x['codec_type']=='video']
          audio=[x for x in d['streams'] if x['codec_type']=='audio']
          assert len(video)==1 and (video[0]['width'],video[0]['height'])==(2160,3840)
          assert video[0]['codec_name']=='h264' and video[0]['r_frame_rate']=='60/1'
          assert audio and audio[0]['codec_name']=='aac'
          assert 41.5 <= float(d['format']['duration']) <= 42.5
          print('QC technical: 9:16, 2160x3840, H.264, 60fps, AAC, 42s')
          PY
          ffmpeg -hide_banner -loglevel error -y -ss 1 -i "$VIDEO" -frames:v 1 -q:v 2 "$COVER"
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('content/media/instagram/2026-11-04/titanic-vertical-4k60')
          vid=d/'REEL-TITANIC-VERTICAL-CLEAN-4K60.mp4'
          cover=d/'CAPA-TITANIC-VERTICAL-4K.jpg'
          manifest={
            'id':'tue-2026-11-04-18-titanic-vertical-clean-v2',
            'version':2,
            'preset_id':'TUE-MESTRE-01',
            'status':'final_render_verified_not_published_visual_approval_pending',
            'title':'Titanic: os botes que partiram com lugares vazios',
            'duration_seconds':42,'width':2160,'height':3840,'fps':60,
            'kind':'reel','voice':'Rasalgethi','synthetic_voice':True,
            'is_ai_generated':True,'ai_disclosure_required':True,
            'music':False,'story':False,'published':False,
            'full_bleed':True,'images_stretched':False,
            'source_photos_native_portrait':3,'source_photos_high_resolution_crop':2,
            'video_file':vid.name,'cover_file':cover.name,
            'video_sha256':hashlib.sha256(vid.read_bytes()).hexdigest(),
            'cover_sha256':hashlib.sha256(cover.read_bytes()).hexdigest(),
            'source_photos':[
              'https://commons.wikimedia.org/wiki/File:Scheepvaart,_schepen_op_naam,_scheepsrampen,_SFA003004215.jpg',
              'https://commons.wikimedia.org/wiki/File:RMS_Titanic_3.jpg',
              'https://commons.wikimedia.org/wiki/File:Titanicboat_12.jpg',
              'https://commons.wikimedia.org/wiki/File:Een_reddingsboot_van_de_Titanic,_die_15_april_1912_bij_de_Noordpool_op_een_ijsberg_is_gelopen_en,_SFA002006965.jpg',
              'https://commons.wikimedia.org/wiki/File:Titanic_lifeboat.jpg'],
            'source_factual':['https://www.titanicinquiry.org/BOTInq/BOTReport/BOTRepBoats.php',
                              'https://www.senate.gov/about/powers-procedures/investigations/titanic.htm']
          }
          (d/'RELEASE.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('VIDEO_SHA256='+manifest['video_sha256'])
          PY
      - name: Preserve verified files (no Meta API calls)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/media/instagram/2026-11-04/titanic-vertical-4k60
          if git diff --cached --quiet; then echo 'Already archived'; exit 0; fi
          git commit -m 'media(instagram): master vertical 4K60 Titanic v2 verified'
          git pull --rebase origin main
          git push origin HEAD:main
