name: Instagram TUE - dois posts por dia 31out a 06nov 2026
# Legado desativado: a única agenda recorrente fica em instagram-scheduler.yml.
# Mantido apenas para conferências manuais sem publicação.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Conferir a fila legada sem publicar'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  halloween:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Arquivo histórico — impedir reenvio do workflow legado
        run: echo "Fluxo histórico desativado; use Publicar fila diária do Instagram."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testar o publicador e a fila
        run: |
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -q
          python3 -m unittest discover -s scripts -p 'test_instagram_preflight.py' -q
          python3 -m unittest discover -s scripts -p 'test_*poster.py' -q
      - name: Bloquear arte fora do modelo antes de qualquer tentativa Meta
        run: |
          python3 -m pip install --quiet 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py verify-assets
          python3 scripts/instagram_visual_standard.py audit-queue
      - name: Prévia segura da fila
        env:
          INSTAGRAM_USERNAME: temumaexplicacao
        run: python3 scripts/instagram_queue.py --dry-run
      - name: Salvar cópia de recuperação do recibo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halloween-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 14
