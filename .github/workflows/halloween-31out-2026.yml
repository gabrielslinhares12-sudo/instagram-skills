name: Instagram TUE - Halloween 2026 (12h e 18h)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/halloween-31out-2026.yml', 'scripts/instagram_queue.py', 'scripts/test_instagram_queue.py', 'content/schedule.json']
  schedule:
    - cron: '0 15 31 10 *'
    - cron: '0 21 31 10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verificar fila sem postar'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  halloween:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Proibir publicação fora das duas janelas datadas
        id: gate
        shell: bash
        run: |
          DAY="$(date -u +%F)"
          UTC_HM="$(date -u +%H%M)"
          if [ "$DAY" = "2026-10-31" ] && { [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "push" ] && [ "$UTC_HM" -ge 1500 ] && [ "$UTC_HM" -le 1520 ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Approved dated Halloween execution ($DAY at $UTC_HM UTC)"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Smoke test/manual preview only, NO publication."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testar o publicador e a fila
        run: |
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -q
          python3 -m unittest discover -s scripts -p 'test_instagram_preflight.py' -q
          python3 -m unittest discover -s scripts -p 'test_*poster.py' -q
      - name: Prévia segura da fila
        env:
          INSTAGRAM_USERNAME: temumaexplicacao
        run: python3 scripts/instagram_queue.py --dry-run
      - name: Verificar identidade Meta e publicar somente item devido
        if: steps.gate.outputs.publish == 'true'
        env:
          INSTAGRAM_SCHEDULER_ENABLED: 'true'
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: temumaexplicacao
        run: |
          if python3 scripts/instagram_queue.py --dry-run > /tmp/halloween_queue.json && python3 -c 'import json;d=json.load(open("/tmp/halloween_queue.json"));raise SystemExit(0 if any(x["status"]=="due" for x in d["items"]) else 1)'; then
            python3 scripts/instagram_preflight.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            python3 scripts/instagram_queue.py --execute
          else
            echo "No due post in safe two-hour window; no publishing."
          fi
      - name: Salvar cópia de recuperação do recibo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halloween-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 14
