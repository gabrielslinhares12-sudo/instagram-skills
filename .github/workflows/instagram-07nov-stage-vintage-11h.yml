name: Instagram TUE — 07NOV preparar 11h tirinha vintage corrigida

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  stage_approved_07nov_carousel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
    steps:
      - name: Checkout main and allow publication-ledger writes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pillow for exact format validation
        run: python3 -m pip install --disable-pip-version-check -q 'Pillow>=11,<13'
      - name: Verify native schedule validator and post identity rules
        run: |
          python3 -m py_compile scripts/instagram_stage_07nov_vintage_11h.py scripts/instagram_queue.py
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -q
      - name: Stage verified five JPGs from private Drive and queue 11h BRT
        run: python3 -u scripts/instagram_stage_07nov_vintage_11h.py
      - name: Preserve staging audit; no publishing in this workflow
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 07nov-vintage-11h-stage-${{ github.run_id }}
          path: |
            content/media/instagram/2026-11-07/RH-DO-CAOS-VINTAGE/SOURCE.json
            content/schedule.json
          if-no-files-found: ignore
          retention-days: 14
