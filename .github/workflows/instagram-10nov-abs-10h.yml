name: "Instagram TUE — ABS 10nov 10h (publicação única)"
on:
  push:
    branches: [main]
    paths: [".github/workflows/instagram-10nov-abs-10h.yml"]
  schedule:
    - cron: "1,4,7,12,20,30,40 13 10 11 *"
  # Push of this recovery change triggers immediate execution only within 10h-12h BRT.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  abs-10h:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTAGRAM_SCHEDULER_ENABLED: "true"
      INSTAGRAM_USERNAME: "temumaexplicacao"
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
    steps:
      - name: Checkout and preserve durable publication state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact target and due time for authorized 10h recovery
        id: gate
        run: |
          python3 - <<'PY'
          import json,os,datetime
          from pathlib import Path
          post_id="tue-2026-11-10-10-abs-sem-fisica-aplicada-v6"
          posts=json.loads(Path("content/schedule.json").read_text())["posts"]
          found=[p for p in posts if p.get("id")==post_id]
          assert len(found)==1
          p=found[0]
          assert p["approved"] is True and p["kind"]=="carousel"
          assert p["due_at"]=="2026-11-10T13:00:00Z" and len(p["media_urls"])==5
          assert p["target_url"]=="https://www.instagram.com/temumaexplicacao/"
          now=datetime.datetime.now(datetime.timezone.utc)
          publishing=(os.getenv("GITHUB_EVENT_NAME") in ("schedule","push") and
              datetime.datetime(2026,11,10,13,tzinfo=datetime.timezone.utc)<=now<
              datetime.datetime(2026,11,10,15,tzinfo=datetime.timezone.utc))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("publish="+str(publishing).lower()+"\n")
          print("ABS_10H_SCHEDULED="+p["due_at"])
          print("ABS_10H_EVENT="+os.getenv("GITHUB_EVENT_NAME",""))
          print("ABS_10H_PUBLICATION_GATE="+str(publishing).lower())
          PY
      - name: Test exact five JPEGs and pinned media hashes
        run: |
          python3 -m pip -q install "Pillow>=11,<13"
          python3 - <<'PY'
          import json,hashlib,urllib.request
          from PIL import Image
          from pathlib import Path
          post=next(p for p in json.loads(Path("content/schedule.json").read_text())["posts"] if p["id"]=="tue-2026-11-10-10-abs-sem-fisica-aplicada-v6")
          for i,(url,sha) in enumerate(zip(post["media_urls"],post["media_sha256"]),1):
              p=Path(f"content/media/instagram/2026-11-10/abs-10h-v6/{i:02d}.jpg")
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
              with Image.open(p) as im: assert im.size==(1080,1350) and im.format=="JPEG"
              with urllib.request.urlopen(urllib.request.Request(url,method="GET",headers={"User-Agent":"InstagramTUE/1.0"}),timeout=35) as r:
                  data=r.read()
              assert hashlib.sha256(data).hexdigest()==sha, "META_MEDIA_URL_NOT_PUBLIC_OR_HASH_MISMATCH"
          print("MEDIA_PUBLIC_HTTPS_5_SHA256_VERIFIED")
          PY
      - name: Dry-run the full Instagram queue and assert ABS is visible
        run: |
          python3 scripts/instagram_queue.py --dry-run > /tmp/ig-abs-plan.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/ig-abs-plan.json"))
          p=next(p for p in x["items"] if p["id"]=="tue-2026-11-10-10-abs-sem-fisica-aplicada-v6")
          assert p["status"] in ("future","due","published")
          print("QUEUE_ABS_STATUS="+p["status"])
          PY
      - name: Verify Meta account and token before 10h
        run: python3 scripts/instagram_preflight.py
      - name: Read live Instagram media to prevent duplicate ABS publication
        id: dedup
        if: steps.gate.outputs.publish == 'true'
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          import os
          from facebook_poster import FacebookPoster, FacebookConfig
          poster=FacebookPoster(FacebookConfig.from_env())
          identity=poster.check_identity()
          assert identity["username"]=="temumaexplicacao","WRONG_INSTAGRAM_ACCOUNT"
          data=poster._request("GET",identity["instagram_user_id"]+"/media",params={"fields":"id,caption,timestamp,permalink,media_type","limit":50},timeout=40)
          records=data.get("data",[])
          assert isinstance(records,list),"META_MEDIA_FEED_NOT_READABLE"
          duplicates=[x for x in records if "freio abs" in str(x.get("caption","")).lower() and str(x.get("timestamp","")).startswith("2026-11-10")]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("safe="+str(not duplicates).lower()+"\n")
          print("LIVE_META_DUPLICATE_ABS="+str(bool(duplicates)).lower())
          if duplicates:
              print("ALREADY_PUBLISHED_META_ID="+str(duplicates[0].get("id","")))
              print("ALREADY_PUBLISHED_META_URL="+str(duplicates[0].get("permalink","")))
          PY
      - name: Configure durable claim before publishing
        if: steps.gate.outputs.publish == 'true' && steps.dedup.outputs.safe == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish the 10h ABS carousel once, after exact due time
        if: steps.gate.outputs.publish == 'true' && steps.dedup.outputs.safe == 'true'
        run: |
          set -o pipefail
          python3 scripts/instagram_queue.py --execute | tee /tmp/tue-abs-result.json
          python3 - <<'PY'
          import json
          j=json.load(open("/tmp/tue-abs-result.json"))
          if j.get("status")=="published" and j.get("item_id")=="tue-2026-11-10-10-abs-sem-fisica-aplicada-v6":
              print("ABS_MEDIA_PUBLISHED="+j["media_id"])
          elif j.get("status")=="needs_review":
              raise SystemExit("ABS_POST_OUTCOME_UNCONFIRMED_INSPECT_META_LEDGER_NO_AUTO_RETRY")
          else:
              print("ABS_NO_PUBLICATION_THIS_RUN_CHECK_PRIOR_CLAIM")
          PY
      - name: Confirm permalink from Meta receipt
        if: steps.gate.outputs.publish == 'true' && steps.dedup.outputs.safe == 'true'
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          import json
          from facebook_poster import FacebookPoster,FacebookConfig
          from pathlib import Path
          state=json.loads(Path("content/publication-state.json").read_text())
          p=state["items"].get("tue-2026-11-10-10-abs-sem-fisica-aplicada-v6",{})
          assert p.get("status")=="published" and p.get("media_id"),"ABS_NOT_CONFIRMED_PUBLISHED"
          poster=FacebookPoster(FacebookConfig.from_env())
          x=poster._request("GET",p["media_id"],params={"fields":"id,permalink,media_type"},timeout=40)
          assert str(x.get("id"))==str(p["media_id"]) and x.get("permalink"),"META_PERMALINK_MISSING"
          print("ABS_INSTAGRAM_PERMALINK="+x["permalink"])
          PY
