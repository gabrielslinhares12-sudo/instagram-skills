name: Instagram TUE - testar selecao de 8 fotos no Android cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-android-photo-picker-probe.yml'
      - 'scripts/instagram_android_photo_picker_probe.py'
permissions:
  contents: read
concurrency:
  group: instagram-photo-picker-cloud-test
  cancel-in-progress: true
jobs:
  photo_picker:
    name: Selecionar 8 fotos no Files sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 - validar JPGs e selecao multipla real
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/instagram_android_cloud_probe.sh && python3 scripts/instagram_android_photo_picker_probe.py
      - name: Guardar evidencias do seletor sem dados de conta
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-picker-real-8-${{ github.run_id }}
          path: cloud-probe/photo-picker/
          retention-days: 3
          if-no-files-found: ignore
