name: TUE 05NOV — publicar carrossel Lúmino aprovado agora
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tue-05nov-lumino-approved-publish-now-once.yml'
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  publish-approved-carousel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
    steps:
      - name: Checkout official publisher with write permission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - name: Install Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install image verification libraries
        run: python3 -m pip install -q 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Verify code compiles and target account is fixed
        run: |
          python3 -m py_compile scripts/instagram_publish_lumino_05nov_approved_once.py
          test "$INSTAGRAM_USERNAME" = "temumaexplicacao"
      - name: Download exactly six approved files, protect image hashes, publish only new Lúmino post
        run: python3 scripts/instagram_publish_lumino_05nov_approved_once.py
      - name: Preserve immutable processing and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lumino-approved-six-images-publishing-${{ github.run_id }}
          path: |
            content/publication-state.json
            content/media/instagram/2026-11-05/LUMINO-HISTORIA-FINAL-APROVADO/
          if-no-files-found: warn
          retention-days: 14
# One-shot: only edits to this workflow file can re-trigger it, the ledger prevents re-publication.
