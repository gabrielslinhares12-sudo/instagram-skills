name: Preparar imagens públicas JPEG para Meta Instagram

# Único objetivo: converter as artes aprovadas, hospedá-las como JPEG e testar o acesso.
# Não modifica a fila content/schedule.json e NÃO publica no Instagram.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-media-jpeg.yml'
      - 'scripts/prepare_instagram_meta_media.py'
      - 'content/media/instagram/2026-11-02/*.png'

permissions:
  contents: write

concurrency:
  group: instagram-meta-media-02nov
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Converter seis PNGs em JPEG 1080x1350 (sem reconstruir arte)
        run: |
          python -m pip install 'Pillow>=11,<13'
          python scripts/prepare_instagram_meta_media.py
      - name: Verificar JPEG, tamanho e formato sem colocar na fila
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base=Path("content/media/instagram/2026-11-02")
          data=json.loads((base/"meta-media-manifest.json").read_text(encoding="utf8"))
          assert data["publication_status"]=="NOT_SCHEDULED_NOT_PUBLISHED"
          assert len(data["files"])==6
          for item in data["files"]:
              f=base/item["jpeg_name"]
              with Image.open(f) as im:
                  assert im.format=="JPEG" and im.size==(1080,1350)
              assert 0<f.stat().st_size<=8_000_000
              assert item["public_jpeg_url"].startswith("https://raw.githubusercontent.com/")
          print("6 JPEGs para Meta verificados, sem agendar nada.")
          PY
      - name: Commitar apenas seis JPEGs e manifesto de mídia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/media/instagram/2026-11-02/*.jpg content/media/instagram/2026-11-02/meta-media-manifest.json
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo para enviar."
          else
            git commit -m "assets(instagram): JPEG 1080x1350 publicamente acessíveis para Meta"
            git push origin HEAD:main
          fi
      - name: Validar origem HTTPS pública (sem usar credenciais Meta)
        run: |
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          m=json.loads(Path("content/media/instagram/2026-11-02/meta-media-manifest.json").read_text())
          for item in m["files"]:
              url=item["public_jpeg_url"]
              last=None
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"TUE-Meta-Media-QC/1.0"})
                      with urllib.request.urlopen(req,timeout=15) as response:
                          body=response.read()
                          media=response.headers.get("Content-Type","")
                          assert response.status==200 and body[:3]==b"\\xff\\xd8\\xff"
                          assert "image/jpeg" in media
                          assert len(body)==item["bytes"]
                      print("PUBLIC_MEDIA_VERIFIED",item["jpeg_name"],len(body))
                      last=None
                      break
                  except Exception as exc:
                      last=str(exc)
                      time.sleep(4)
              if last:
                  raise RuntimeError(item["jpeg_name"]+": public URL not verified: "+last)
          PY
      - name: Guardar relatório de mídia para auditoria
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meta-media-02nov-${{ github.run_id }}
          path: content/media/instagram/2026-11-02/meta-media-manifest.json
          if-no-files-found: ignore
          retention-days: 14
