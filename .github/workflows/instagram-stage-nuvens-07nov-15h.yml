name: Instagram TUE — agendar nuvens aprovadas de 07NOV as 15h
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-stage-nuvens-07nov-15h.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-temumaexplicacao-staging-07nov-15h
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
    steps:
      - name: Checkout main preserving ability to pin JPGs and queue
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact Pillow version used for approved JPEG export
        run: python3 -m pip install -q 'Pillow==12.3.0'
      - name: Preflight TUE master and Meta credentials
        run: |
          python3 scripts/instagram_preset_mestre.py verify
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -q
          python3 scripts/instagram_preflight.py
      - name: Stage exact PNGs as verified JPGs and schedule 15h BRT
        run: python3 -u scripts/instagram_stage_nuvens_07nov_15h.py
      - name: Verify queue and editorial approval
        run: |
          python3 scripts/instagram_visual_standard.py audit-queue
          python3 scripts/instagram_queue.py --dry-run --now 2026-11-07T17:59:59Z > /tmp/pre.json
          python3 scripts/instagram_queue.py --dry-run --now 2026-11-07T18:00:01Z > /tmp/due.json
          python3 - <<'PY'
          import json
          slug="tue-2026-11-07-15-nuvens-lenticulares-5-artes"
          b=json.load(open("/tmp/pre.json",encoding="utf-8"))
          a=json.load(open("/tmp/due.json",encoding="utf-8"))
          before=[x for x in b["items"] if x["id"]==slug]
          after=[x for x in a["items"] if x["id"]==slug]
          assert len(before)==len(after)==1 and before[0]["status"]=="future" and after[0]["status"]=="due"
          print("VERIFIED_QUEUE_15H=true",flush=True)
          PY
      - name: Preserve staging audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuvens-15h-07nov-${{ github.run_id }}
          path: |
            content/approved/tue-2026-11-07-15-nuvens-lenticulares-5-artes/approval.json
            content/schedule.json
          if-no-files-found: ignore
          retention-days: 14
