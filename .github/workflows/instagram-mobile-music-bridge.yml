name: Instagram TUE - validar automacao Android para musica apos carrossel
on:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram_mobile_music.py'
      - 'scripts/test_instagram_mobile_music.py'
      - '.github/workflows/instagram-mobile-music-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate_offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testar automação Android sem conta e sem dispositivo
        run: |
          python3 -m unittest discover -s scripts -p 'test_instagram_mobile_music.py' -v
          python3 scripts/instagram_mobile_music.py
