name: Instagram 03NOV 15h - Atacama sem musica (Meta)
# Job of a single explicitly approved carousel. Never queues other posts.
# On push: dry-run only. On its 15h BRT schedule: one-shot Meta publish.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/instagram-atacama-03nov-no-music.yml']
  schedule:
    - cron: '2,12,22,32,42,52 18 3 11 *'
    - cron: '2,12,22,32,42,52 19 3 11 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente verificar, nunca publicar ao acionar manualmente'
        required: true
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  atatcama_nov03:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validar fonte, identidade visual e contrato unico
        run: |
          python3 -m pip install 'Pillow>=11,<13'
          python3 -m py_compile scripts/instagram_publish_atacama_nov03_once.py
          python3 scripts/instagram_preset_mestre.py verify
          python3 scripts/instagram_visual_standard.py audit-queue
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -v
          python3 scripts/instagram_publish_atacama_nov03_once.py
      - name: Identificar conta e publicar apenas se horario autorizado
        if: github.event_name == 'schedule'
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/instagram_publish_atacama_nov03_once.py --execute
      - name: Preservar apenas o registro de publicacao para auditoria
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instagram-03nov-atacama-no-music-${{ github.run_id }}
          path: content/publication-state.json
          retention-days: 14
          if-no-files-found: ignore
