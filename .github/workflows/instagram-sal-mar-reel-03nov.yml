name: Instagram TUE - Reel sal do mar 03NOV 18h
# Unica fonte: MP4 original no Drive (compartilhado); SHA256 obrigatorio.
# Criar e validar URL publica agora; publicar somente em 03NOV 18h BRT.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/instagram-sal-mar-reel-03nov.yml']
  workflow_dispatch:
  schedule:
    - cron: '0,15,30,45 21 3 11 *'
    - cron: '0,15,30,45 22 3 11 *'
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  prepare-original:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Garantir suporte a download grande e FFprobe
        run: |
          python3 -m pip install 'gdown>=5,<6'
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 -m py_compile scripts/instagram_drive_sal_mar_nov03.py scripts/instagram_stage_sal_mar_nov03.py scripts/instagram_publish_sal_mar_nov03_once.py
      - name: Baixar MP4 original do Google Drive sem recomprimir e conferir SHA256
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python3 scripts/instagram_drive_sal_mar_nov03.py
      - name: Hospedar MP4 verificado em branch isolado e checar hash publico
        run: python3 scripts/instagram_stage_sal_mar_nov03.py
      - name: Conferir conta e permissao Meta sem publicar
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: python3 scripts/instagram_preflight.py
      - name: Guardar recibo de importacao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tue-reel-sal-mar-preparo-${{ github.run_id }}
          path: output/instagram-drive-sal-mar/import-report.json
          retention-days: 14
          if-no-files-found: warn

  publish-at-18:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verificar scripts e suite de publicacao
        run: |
          python3 -m py_compile scripts/instagram_publish_sal_mar_nov03_once.py scripts/instagram_stage_sal_mar_nov03.py
          python3 -m unittest discover -s scripts -p 'test_facebook_poster.py' -v
          python3 -m unittest discover -s scripts -p 'test_meta_poster.py' -v
      - name: Publicar uma unica vez na Meta somente entre 18h e 20h BRT
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/instagram_publish_sal_mar_nov03_once.py
      - name: Arquivar o recibo duravel sem repetir a publicacao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tue-reel-sal-mar-18h-${{ github.run_id }}
          path: content/publication-state.json
          retention-days: 14
          if-no-files-found: warn
