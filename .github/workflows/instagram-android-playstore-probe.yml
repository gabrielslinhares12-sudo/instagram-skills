name: Instagram TUE - testar Play Store no Android cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-android-playstore-probe.yml'
      - 'scripts/instagram_android_playstore_probe.sh'
permissions:
  contents: read
concurrency:
  group: instagram-android-playstore-probe
  cancel-in-progress: true
jobs:
  android_playstore_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sem credenciais
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Iniciar Android com Google Play e checar pagina do Instagram
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/instagram_android_playstore_probe.sh
      - name: Evidencias do teste sem credenciais
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-android-playstore-probe-${{ github.run_id }}
          path: cloud-probe/
          retention-days: 3
          if-no-files-found: ignore
