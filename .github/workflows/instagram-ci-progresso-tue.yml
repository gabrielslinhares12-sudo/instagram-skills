name: Validar Lúmino e progresso carrossel TUE-MESTRE-01
on:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram_visual_standard.py'
      - 'scripts/test_instagram_visual_standard.py'
      - '.github/workflows/instagram-ci-progresso-tue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Instalar dependência de validação de imagem
        run: python3 -m pip install -q 'Pillow>=11,<13'
      - name: Testes regressivos de mascote, 2 a 20 páginas e dots
        run: python3 -m unittest discover -s scripts -p 'test_instagram_visual_standard.py' -v
      - name: Verificação do arquivo-mestre original
        run: python3 scripts/instagram_visual_standard.py verify-assets
      - name: Conferir fila e bloqueio das versões rejeitadas
        run: python3 scripts/instagram_visual_standard.py audit-queue
