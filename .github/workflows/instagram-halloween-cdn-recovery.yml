name: Instagram TUE - reparo final Halloween via CDN verificado
# No schedule. Only one owner-authorized attempt after confirming no visible post.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-halloween-cdn-recovery.yml'
permissions:
  contents: read
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testes de fila, URLs e imagens sem Meta
        run: |
          python3 -m unittest discover -s scripts -p test_instagram_queue.py -q
          python3 -m pip install -q 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py verify-assets
          python3 scripts/instagram_visual_standard.py audit-queue
          python3 scripts/instagram_halloween_cdn_preflight.py
      - name: Preflight da conta e permissoes Meta somente GET
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: temumaexplicacao
        run: python3 scripts/instagram_preflight.py
      - name: UMA tentativa usando os oito mesmos JPGs servidos pelo CDN
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: temumaexplicacao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/instagram_halloween_cdn_recovery.py
      - name: Preservar o ledger da tentativa
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halloween-cdn-repair-${{ github.run_id }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 30
