name: Instagram 07NOV — recuperar publicacao das 11h com reconciliacao Meta
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-07nov-recover-11h.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
      INSTAGRAM_SCHEDULER_ENABLED: 'true'
    steps:
      - name: Checkout main with safe ledger persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install image validation
        run: python -m pip install -q 'Pillow>=11,<13'
      - name: Validate existing media and queue rules
        run: |
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -q
          python3 scripts/instagram_visual_standard.py verify-assets
          python3 scripts/instagram_preset_mestre.py verify
          python3 scripts/instagram_visual_standard.py audit-queue
      - name: Inspect queued exact post, verify five hosted files, Meta identity and duplicates
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from urllib.request import Request, urlopen
          import hashlib, json
          from instagram_queue import read_document, validate_manifest, validate_state, plan
          from facebook_poster import FacebookPoster, FacebookConfig
          identifier="tue-2026-11-07-11-rh-do-caos-cadeira-vintage-5-artes"
          manifest=read_document(__import__("pathlib").Path("content/schedule.json"))
          posts=validate_manifest(manifest)
          matches=[p for p in posts if p["id"] == identifier]
          assert len(matches)==1, "approved_queue_item_not_found"
          post=matches[0]
          assert post["due_at"]=="2026-11-07T14:00:00Z" and post["approved"] is True
          assert post["kind"]=="carousel" and len(post["media_urls"])==5
          assert post["username"]=="temumaexplicacao"
          now=datetime.now(timezone.utc)
          due=datetime.fromisoformat("2026-11-07T14:00:00+00:00")
          assert due<=now<=due+timedelta(hours=2), "not_in_safe_recovery_window"
          ledger=validate_state(read_document(__import__("pathlib").Path("content/publication-state.json")))
          assert identifier not in ledger["items"], "already_claimed_no_retry"
          statuses=plan(posts,ledger,now)
          match=[x for x in statuses if x["id"]==identifier]
          assert len(match)==1 and match[0]["status"]=="due", "queue_does_not_select_post_as_due"
          for n,(url,expected) in enumerate(zip(post["media_urls"],post["media_sha256"]),1):
              req=Request(url,headers={"User-Agent":"TUE-IG-07NOV-Recovery/1.0"})
              with urlopen(req,timeout=35) as r: content=r.read(2_500_000)
              assert hashlib.sha256(content).hexdigest()==expected, "media_checksum_mismatch"
              print(f"VERIFIED_MEDIA_{n}=true",flush=True)
          poster=FacebookPoster(FacebookConfig.from_env())
          identity=poster.check_identity()
          assert identity.get("username")=="temumaexplicacao" and identity.get("instagram_user_id")=="17841433004716815", "wrong_meta_destination"
          recent=poster._request("GET","17841433004716815/media",params={"fields":"id,caption,media_type,permalink,timestamp","limit":100},timeout=40)
          rows=recent.get("data")
          assert isinstance(rows,list), "cannot_verify_recent_meta_posts"
          for entry in rows:
              caption=str(entry.get("caption") or "").casefold()
              if ("a cadeira pediu demissão" in caption or "a cadeira pediu demissao" in caption or
                  ("#rhdocaos" in caption and "cadeira" in caption)):
                  print("DUPLICATE_CANDIDATE_EXISTING="+str(entry.get("id")),flush=True)
                  print("EXISTING_PERMALINK="+str(entry.get("permalink")),flush=True)
                  raise SystemExit("manual_reconcile_existing_post_no_repost")
          print("META_ACCOUNT_AND_DUPLICATES_VERIFIED=true",flush=True)
          PY
      - name: Verify official Meta publishing permissions
        run: python3 scripts/instagram_preflight.py
      - name: Recover due item using existing one-shot durable Git ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/instagram_queue.py --execute | tee /tmp/tue-07nov-result.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/tue-07nov-result.json",encoding="utf-8"))
          assert r.get("item_id")=="tue-2026-11-07-11-rh-do-caos-cadeira-vintage-5-artes", "no_correct_post_receipt"
          assert r.get("status")=="published" and r.get("media_id"), "no_verified_publication_receipt"
          print("PUBLISH_RECEIPT_MEDIA_ID="+str(r["media_id"]),flush=True)
          PY
      - name: Verify final Meta media permalink
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          import json
          from facebook_poster import FacebookPoster,FacebookConfig
          receipt=json.load(open("/tmp/tue-07nov-result.json",encoding="utf-8"))
          poster=FacebookPoster(FacebookConfig.from_env())
          row=poster._request("GET",receipt["media_id"],params={"fields":"id,permalink,media_type,caption"},timeout=40)
          assert str(row.get("id"))==str(receipt["media_id"]), "media_receipt_not_confirmed"
          assert row.get("media_type")=="CAROUSEL_ALBUM", "not_a_carousel_album"
          assert row.get("permalink"), "missing_permalink"
          print("INSTAGRAM_CONFIRMED_PERMALINK="+row["permalink"],flush=True)
          PY
      - name: Save publication state audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-07nov-recovery-${{ github.run_id }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 14
