name: Instagram TUE — trava do padrao editorial

on:
  push:
    branches: [main]
    paths:
      - 'content/brand/**'
      - 'content/approved/**'
      - 'scripts/instagram_visual_standard.py'
      - 'scripts/render_instagram_carrossel.py'
      - 'scripts/test_instagram_visual_standard.py'
      - '.github/workflows/instagram-editorial-quality.yml'
  pull_request:
    paths:
      - 'content/brand/**'
      - 'content/approved/**'
      - 'scripts/instagram_visual_standard.py'
      - 'scripts/render_instagram_carrossel.py'
      - 'scripts/test_instagram_visual_standard.py'
      - '.github/workflows/instagram-editorial-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar validador local
        run: python -m pip install 'Pillow>=11,<13'
      - name: Verificar PNG original, modelo e hashes
        run: python scripts/instagram_visual_standard.py verify-assets
      - name: Barrar publicacoes aprovadas fora do padrao
        run: python scripts/instagram_visual_standard.py audit-queue
      - name: Testar renderizacao e recusa de mascote alterado
        run: python -m unittest discover -s scripts -p test_instagram_visual_standard.py -v
