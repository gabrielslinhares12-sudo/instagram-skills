name: Instagram TUE — trava do padrao editorial

on:
  push:
    branches: [main]
    paths:
      - 'content/brand/**'
      - 'content/visual-standard/**'
      - 'content/schedule.json'
      - 'content/approved/**'
      - 'scripts/instagram_visual_standard.py'
      - 'scripts/instagram_preset_mestre.py'
      - 'scripts/test_instagram_preset_mestre.py'
      - 'content/editorial/semana-independente-2026-11-02-a-08/**'
      - 'content/brand/QUADROS-TUE-MESTRE-01.json'
      - 'scripts/validate_instagram_weekly_briefs.py'
      - 'scripts/instagram_queue.py'
      - 'scripts/test_instagram_queue.py'
      - '.github/workflows/instagram-scheduler.yml'
      - '.github/workflows/halloween-31out-2026.yml'
      - 'scripts/test_instagram_cloud_workflow.py'
      - 'scripts/instagram_cloud_report.py'
      - 'scripts/instagram_private_music.py'
      - 'scripts/test_instagram_private_music.py'
      - '.github/workflows/instagram-private-music.yml'
      - 'scripts/instagram_preflight.py'
      - 'scripts/test_instagram_preflight.py'
      - 'scripts/render_instagram_carrossel.py'
      - 'scripts/package_individual_carousel.py'
      - 'scripts/test_individual_carousel.py'
      - 'scripts/test_instagram_visual_standard.py'
      - '.github/workflows/instagram-editorial-quality.yml'
  pull_request:
    paths:
      - 'content/brand/**'
      - 'content/visual-standard/**'
      - 'content/schedule.json'
      - 'content/approved/**'
      - 'scripts/instagram_visual_standard.py'
      - 'scripts/instagram_queue.py'
      - 'scripts/test_instagram_queue.py'
      - '.github/workflows/instagram-scheduler.yml'
      - '.github/workflows/halloween-31out-2026.yml'
      - 'scripts/test_instagram_cloud_workflow.py'
      - 'scripts/instagram_cloud_report.py'
      - 'scripts/instagram_private_music.py'
      - 'scripts/test_instagram_private_music.py'
      - '.github/workflows/instagram-private-music.yml'
      - 'scripts/instagram_preflight.py'
      - 'scripts/test_instagram_preflight.py'
      - 'scripts/render_instagram_carrossel.py'
      - 'scripts/package_individual_carousel.py'
      - 'scripts/test_individual_carousel.py'
      - 'scripts/test_instagram_visual_standard.py'
      - '.github/workflows/instagram-editorial-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar validador local
        run: python -m pip install 'Pillow>=11,<13'
      - name: Verificar PNG original, modelo e hashes
        run: python scripts/instagram_visual_standard.py verify-assets
      - name: Validar ativacao automatica TUE-MESTRE-01 e hashes imutaveis
        run: python scripts/instagram_preset_mestre.py verify
      - name: Testar bloqueios de arte sem preset e revisao manual
        run: python -m unittest discover -s scripts -p test_instagram_preset_mestre.py -v
      - name: Validar 14 temas autonomos da semana
        run: python scripts/instagram_preset_mestre.py check-week --plan content/editorial/semana-independente-2026-11-02-a-08/grade.json
      - name: Validar integridade dos 14 briefings, quadros e temas independentes
        run: python scripts/validate_instagram_weekly_briefs.py
      - name: Barrar publicacoes aprovadas fora do padrao
        run: python scripts/instagram_visual_standard.py audit-queue
      - name: Validar preparação segura do método móvel privado (desativado)
        run: python -m unittest discover -s scripts -p test_instagram_private_music.py -v
      - name: Validar agendamento cloud e isolamento do fluxo antigo
        run: python -m unittest discover -s scripts -p test_instagram_cloud_workflow.py -v
      - name: Testar roteamento de publicação e prevenção de duplicatas
        run: python -m unittest discover -s scripts -p test_instagram_queue.py -v
      - name: Verificar diagnóstico seguro da conexão Meta sem rede
        run: python -m unittest discover -s scripts -p test_instagram_preflight.py -v
      - name: Testar páginas individuais e prévia idêntica às artes finais
        run: python -m unittest discover -s scripts -p test_individual_carousel.py -v
      - name: Testar renderizacao e recusa de mascote alterado
        run: python -m unittest discover -s scripts -p test_instagram_visual_standard.py -v
