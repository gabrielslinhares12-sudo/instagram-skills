name: Instagram TUE - diagnosticar edicao musical GitHub sem repostar
# One-shot read-only capability check. No schedule: avoid wasted CI and false
# promises of editing native carousel audio with a publication-only API.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram_music_cloud_gate.py'
      - 'scripts/test_instagram_music_cloud_gate.py'
      - '.github/workflows/instagram-music-cloud-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github_only_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testes de segurança sem sessão e sem edição
        run: python3 -m unittest discover -s scripts -p 'test_instagram_music_cloud_gate.py' -v
      - name: Relatório GitHub-only com estado verificável
        run: python3 scripts/instagram_music_cloud_gate.py
