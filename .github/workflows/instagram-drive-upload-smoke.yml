name: TUE - validar transferencia de arquivos GitHub para Google Drive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-drive-upload-smoke.yml'
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe dos importadores e do Drive
        run: |
          python -m py_compile scripts/instagram_youtube_multi_client.py
          python -m py_compile scripts/instagram_youtube_invidious.py
          python -m py_compile scripts/instagram_youtube_piped.py
          python -m py_compile scripts/instagram_reel_google_drive_upload.py
      - name: Sem MP4 nao criar recibo nem simular upload
        run: python scripts/instagram_reel_google_drive_upload.py
