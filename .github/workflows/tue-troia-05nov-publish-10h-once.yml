name: TUE Troia - publicar somente as 10h 05NOV via Meta
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tue-troia-05nov-publish-10h-once.yml'
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  publicar-no-horario:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    env:
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
      INSTAGRAM_SCHEDULER_ENABLED: 'true'
    steps:
      - name: Aguardar 05NOV 13h UTC = 10h Brasilia com heartbeat
        shell: bash
        run: |
          set -euo pipefail
          target=$(date -u -d '2026-11-05 13:00:00 UTC' +%s)
          now=$(date -u +%s)
          if [ "$now" -ge "$target" ]; then
            echo "HORARIO_10H_JA_CHEGOU: verificar janela de execucao"
          fi
          while [ "$(date -u +%s)" -lt "$target" ]; do
            now=$(date -u +%s)
            echo "PRE_PUBLICACAO_10H_BRT: segundos_restantes=$((target-now))"
            sleep 60
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
      - name: Ler ultima fila e impedir reenvio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          python3 scripts/instagram_queue.py --dry-run > /tmp/tue-troia-plan.json
          python3 - <<'PY'
          import json
          plan=json.load(open('/tmp/tue-troia-plan.json',encoding='utf8'))
          row=next((i for i in plan['items'] if i['id']=='tue-2026-11-05-10-cavalo-de-troia'),None)
          assert row and row['due_at']=='2026-11-05T13:00:00Z', 'FILA_TROIA_HORARIO_ALTERADO'
          print('TROIA_DUE_STATUS',row['status'])
          if row['status'] not in ('due','published','claimed','needs_review'):
            raise SystemExit('TROIA_NAO_ELEGIVEL: nao publicar')
          PY
      - name: Conferir identidade Meta e permissoes somente GET
        shell: bash
        run: python3 scripts/instagram_preflight.py
      - name: Executar fila oficial uma unica vez com ledger antidupe
        shell: bash
        run: python3 scripts/instagram_queue.py --execute
      - name: Inspecionar estado final local sem nova publicacao
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('content/publication-state.json',encoding='utf8'))
          row=data.get('items',{}).get('tue-2026-11-05-10-cavalo-de-troia',{})
          print('RECIBO_POST_TROIA',json.dumps({k:row.get(k) for k in ('status','media_id','published_at','due_at')},ensure_ascii=False))
          assert row.get('status') in ('published','claimed','needs_review')
          PY
# Esta acao se inicia por um unico push e NAO publica antes das 10h.
# Se a plataforma retornar resultado incerto, manter claim; jamais repetir POST cegamente.
