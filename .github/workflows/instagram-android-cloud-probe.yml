name: Instagram TUE - teste Android na nuvem sem publicar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-android-cloud-probe.yml'
      - 'scripts/instagram_android_cloud_probe.sh'

permissions:
  contents: read

concurrency:
  group: instagram-android-cloud-probe
  cancel-in-progress: true

jobs:
  android_probe:
    name: Validar Android virtual e carrossel sem autenticar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ativar aceleracao de emulador KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Iniciar Android em runner GitHub e validar 8 JPEGs no seletor
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/instagram_android_cloud_probe.sh
      - name: Arquivar diagnostico (sem contas, credenciais ou dados pessoais)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-android-cloud-probe-${{ github.run_id }}
          path: cloud-probe/
          if-no-files-found: ignore
          retention-days: 3
