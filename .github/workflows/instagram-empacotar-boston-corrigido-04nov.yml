name: Empacotar carrossel Boston 04NOV com cinco lâminas originais
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-empacotar-boston-corrigido-04nov.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-boston-04nov-zip
  cancel-in-progress: false
jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - name: Gerar pacote imutável só com as cinco lâminas corrigidas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          p=Path('content/media/instagram/2026-11-04/REWORK-TUE-MESTRE-01')
          r=json.loads((p/'BOSTON-REWORK-QC.json').read_text())
          assert r['lumino_sha256']=='f905d801f013c2e253b8a17ae3bc1279b57022d1b805baa632f291a3b73e0c1b'
          assert len(r['pages'])==5 and not r['approved'] and r['publication_blocked']
          zip_path=p/'BOSTON-CARROSSEL-5-LAMINAS-LUMINO-ORIGINAL.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for idx,item in enumerate(r['pages']):
                  name=item['file']
                  assert name==f'BOSTON-MESTRE01-{idx+1:02d}.jpg'
                  media=p/name
                  assert hashlib.sha256(media.read_bytes()).hexdigest()==item['sha256']
                  z.write(media,arcname=name)
              z.write(p/'BOSTON-REWORK-QC.json',arcname='BOSTON-REWORK-QC.json')
          print('ZIP_OK bytes',zip_path.stat().st_size, 'sha256',hashlib.sha256(zip_path.read_bytes()).hexdigest())
          PY
      - name: Arquivar sem publicação
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/media/instagram/2026-11-04/REWORK-TUE-MESTRE-01/BOSTON-CARROSSEL-5-LAMINAS-LUMINO-ORIGINAL.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'archive(instagram): pacote de cinco JPEGs Boston com Lúmino original'
          git pull --rebase origin main
          git push origin HEAD:main
