name: Publicar fila diária do Instagram

# Operação em GitHub-hosted Ubuntu: nenhum PC/runner GUTHY/Android necessário.
# O cron roda em UTC; a fila guarda horários ISO UTC e previne duplicatas.
# Referencia visual oficial, travada por SHA: content/brand/REFERENCIA-VISUAL-OFICIAL-TUE-MESTRE-01-02NOV2026.jpg
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-scheduler.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Conferir a fila sem publicar'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Somente runner GitHub-hosted; nunca usar Windows/self-hosted.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testar publicação e fila sem rede
        run: |
          python3 -m unittest discover -s scripts -p 'test_*poster.py' -v
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -v
          python3 -m unittest discover -s scripts -p 'test_instagram_preflight.py' -v
          python3 -m unittest discover -s scripts -p 'test_instagram_story_reconcile.py' -v
      - name: Aplicar padrao editorial canônico antes de qualquer publicação
        run: |
          python3 -m pip install 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py verify-assets
          python3 scripts/instagram_preset_mestre.py verify
          python3 -m unittest discover -s scripts -p 'test_instagram_preset_mestre.py' -v
          python3 scripts/validate_instagram_weekly_briefs.py
          python3 scripts/instagram_visual_standard.py audit-queue
      - name: Configurar identidade da automação para o registro
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Conferir ou executar somente a publicação devida
        env:
          QUEUE_DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && 'true' || 'false' }}
          INSTAGRAM_SCHEDULER_ENABLED: ${{ vars.INSTAGRAM_SCHEDULER_ENABLED || 'true' }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          echo 'GitHub-hosted Instagram scheduler: nenhum PC ou dispositivo local.'
          if [ "$QUEUE_DRY_RUN" = 'true' ]; then
            python3 scripts/instagram_queue.py --dry-run > /tmp/instagram-queue-plan.json
            python3 scripts/instagram_cloud_report.py /tmp/instagram-queue-plan.json
          else
            # Preflight before claiming a due item; missing grants must not
            # consume its one-shot publication slot.
            python3 scripts/instagram_queue.py --dry-run > /tmp/instagram-queue-plan.json
            python3 scripts/instagram_cloud_report.py /tmp/instagram-queue-plan.json
            if python3 -c 'import json; d=json.load(open("/tmp/instagram-queue-plan.json", encoding="utf-8")); raise SystemExit(0 if any(x["status"] == "due" for x in d["items"]) else 1)'; then
              python3 scripts/instagram_preflight.py
            fi
            python3 scripts/instagram_queue.py --execute
          fi
      - name: Conciliar Stories vinculados apos comprovante do feed
        # This checks the published post permalink only; it DOES NOT upload a
        # Story or claim the user's spoken CTA.
        if: success()
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          python3 scripts/instagram_story_reconcile.py --execute
          if ! git diff --quiet -- content/editorial/STORIES-VINCULADOS-2026-11-02-a-08.json; then
            git add content/editorial/STORIES-VINCULADOS-2026-11-02-a-08.json
            git commit -m 'ops(stories): registrar post original confirmado e Story nativo pendente'
            git push origin HEAD:main
          fi
      - name: Preservar registro local para recuperação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instagram-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 14
