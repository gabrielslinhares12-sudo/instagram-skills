name: Publicar fila diária do Instagram

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Conferir a fila sem publicar'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  queue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testar publicação e fila sem rede
        run: |
          python3 -m unittest discover -s scripts -p 'test_*poster.py' -v
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -v
          python3 -m unittest discover -s scripts -p 'test_instagram_preflight.py' -v
      - name: Conferir estado da produção Instagram (sem publicar)
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          manifest = json.loads(Path("content/schedule.json").read_text(encoding="utf-8"))
          ledger = json.loads(Path("content/publication-state.json").read_text(encoding="utf-8"))
          rows = [
              "## Monitor de produção e publicação do Instagram",
              "",
              "Verificação de estado do repositório. Este passo não produz imagens nem comprova publicação na Meta.",
              "",
              "| Conteúdo | Situação | Agendado (UTC) |",
              "|---|---|---|",
          ]
          for p in manifest["posts"]:
              previous = ledger.get("items", {}).get(p["id"])
              if previous:
                  status = "Ledger: " + previous.get("status", "desconhecido")
              elif not p["approved"]:
                  if any("PENDENTE" in u for u in p["media_urls"]):
                      status = "Bloqueado: mídia final pendente"
                  else:
                      status = "Bloqueado: aguardando revisão/liberação"
              else:
                  status = "Liberado na fila, ainda sem recibo"
              problems = []
              for u in p["media_urls"]:
                  parsed = urlsplit(u)
                  if parsed.hostname != "raw.githubusercontent.com":
                      continue
                  segments = parsed.path.lstrip("/").split("/", 3)
                  if len(segments) != 4:
                      problems.append("URL incompleta")
                      continue
                  local = Path(segments[3])
                  if not local.is_file():
                      problems.append("arquivo não encontrado no checkout")
              if problems:
                  status += " (" + ", ".join(sorted(set(problems))) + ")"
              rows.append("| " + p["id"] + " | " + status + " | " + p["due_at"] + " |")
          report = "\n".join(rows) + "\n"
          print(report)
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as output:
                  output.write(report)
          PY
      - name: Configurar identidade da automação para o registro
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Conferir ou executar somente a publicação devida
        env:
          QUEUE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          INSTAGRAM_SCHEDULER_ENABLED: ${{ vars.INSTAGRAM_SCHEDULER_ENABLED || 'true' }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          if [ "$QUEUE_DRY_RUN" = 'true' ]; then
            python3 scripts/instagram_queue.py --dry-run
          else
            # Preflight before claiming a due item; missing grants must not
            # consume its one-shot publication slot.
            python3 scripts/instagram_queue.py --dry-run > /tmp/instagram-queue-plan.json
            if python3 -c 'import json; d=json.load(open("/tmp/instagram-queue-plan.json", encoding="utf-8")); raise SystemExit(0 if any(x["status"] == "due" for x in d["items"]) else 1)'; then
              python3 scripts/instagram_preflight.py
            fi
            python3 scripts/instagram_queue.py --execute
          fi
      - name: Preservar registro local para recuperação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instagram-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 14
