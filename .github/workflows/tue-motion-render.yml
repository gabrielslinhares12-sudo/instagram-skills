name: TUE Motion - render sem PC
on:
  workflow_dispatch:
    inputs:
      quality:
        description: Qualidade do arquivo
        type: choice
        options: [preview, pilot, 4k]
        default: pilot
  pull_request:
    paths: ['motion/**', '.github/workflows/tue-motion-render.yml']
permissions:
  contents: read
concurrency:
  group: tue-motion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Render preview or master
        env:
          QUALITY: ${{ inputs.quality || 'pilot' }}
        run: |
          if [ "$QUALITY" = "4k" ]; then
            npm run render -- --concurrency=2
          elif [ "$QUALITY" = "pilot" ]; then
            npm run pilot-preview -- --concurrency=2
          else
            npm run preview -- --concurrency=2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tue-motion-${{ github.run_id }}
          path: motion/out/*.mp4
          retention-days: 3
          if-no-files-found: error
