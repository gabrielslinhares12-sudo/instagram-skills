name: Odisseia — verificar acesso Drive ao MP4 do episodio 1 (somente leitura)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/odisseia-drive-oauth-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validar secrets do Drive e acesso ao MP4 sem revelar token nem dados sensiveis
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error
          vals=[os.environ.get(x,"").strip() for x in ("GDRIVE_OAUTH_CLIENT_ID","GDRIVE_OAUTH_CLIENT_SECRET","GDRIVE_OAUTH_REFRESH_TOKEN")]
          print("ODYSSEY_DRIVE_OAUTH_SECRETS_PRESENT="+str(all(vals)).lower())
          if not all(vals):
            print("ODYSSEY_DRIVE_PREFLIGHT=blocked_missing_secrets")
            raise SystemExit(0)
          form=urllib.parse.urlencode(dict(client_id=vals[0],client_secret=vals[1],refresh_token=vals[2],grant_type="refresh_token")).encode()
          try:
            req=urllib.request.Request("https://oauth2.googleapis.com/token",data=form,headers={"Content-Type":"application/x-www-form-urlencoded"})
            with urllib.request.urlopen(req,timeout=20) as res:
              token=json.load(res)["access_token"]
            file_id="18PQYvYPpBRKqLPEJDVhHbMo9D01UWP7b"
            url="https://www.googleapis.com/drive/v3/files/"+file_id+"?fields=id,mimeType,size,name"
            req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
            with urllib.request.urlopen(req,timeout=20) as res:
              d=json.load(res)
            assert d.get("id")==file_id and d.get("mimeType")=="video/mp4"
            assert int(d.get("size",0))==94801424
            print("ODYSSEY_DRIVE_PREFLIGHT=passed")
            print("ODYSSEY_MEDIA_BYTES_VERIFIED=true")
          except Exception as e:
            print("ODYSSEY_DRIVE_PREFLIGHT=blocked")
            print("ERROR_TYPE="+type(e).__name__)
          PY
# GET only. Never publishes, schedules, shares files, or touches any media state.
