name: Instagram TUE 03NOV - conferir duas postagens antes dos horarios
on:
  push:
    branches: [main]
    paths: ['.github/workflows/instagram-03nov-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instagram-03nov-preflight
  cancel-in-progress: false
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testes do validador de fila
        run: |
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -v
          python3 -m pip install 'Pillow>=11,<13'
      - name: Conferir padrao e aprovacao do meme 11h sem publicar
        run: |
          python3 scripts/instagram_preset_mestre.py verify
          python3 scripts/instagram_visual_standard.py audit-queue
      - name: Simular a fila das 11h e 15h sem escrever na conta
        run: |
          python3 scripts/instagram_queue.py --dry-run --now '2026-11-03T14:05:00Z'
          python3 scripts/instagram_queue.py --dry-run --now '2026-11-03T18:05:00Z'
      - name: Conferir permissao Meta Instagram sem criar midia
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: python3 scripts/instagram_preflight.py
