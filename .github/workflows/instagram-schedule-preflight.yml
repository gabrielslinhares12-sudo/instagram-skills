name: Instagram TUE — checagem antecipada 11h 15h 18h
# Detect absent or unapproved content before publication. Read-only.
# 13:31 UTC is 10:31 Brasilia, 17:31->14:31, 20:31->17:31.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-schedule-preflight.yml'
  schedule:
    - cron: '31,41 13,17,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify_upcoming_slots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify slot exists with owner-approved material
        run: python3 scripts/instagram_schedule_guard.py --mode preflight
      - name: Validate actual imminent artwork, not future drafts
        run: |
          python3 -m pip install -q 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py audit-queue --only-imminent
      - name: Audit upcoming slot in GitHub run summary
        if: always()
        run: |
          python3 scripts/instagram_schedule_guard.py --mode report >> "$GITHUB_STEP_SUMMARY"
