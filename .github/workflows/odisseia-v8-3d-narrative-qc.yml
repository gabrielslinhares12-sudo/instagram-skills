name: Odisseia V8 — primeiro cenário 3D real, Polifemo, QC narrativo
on:
  push:
    branches: [main]
    paths:
      - 'odyssey_v8/cave_scene.py'
      - '.github/workflows/odisseia-v8-3d-narrative-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odyssey-v8-3d-storyboard-qc
  cancel-in-progress: false

jobs:
  render-physical-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Preparar dependencias 100% gratuitas e render 3D nativo
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'vtk==9.6.2'
          ffmpeg -version | head -n 1
          python - <<'PY'
          import vtk,numpy
          print('VTK_3D_VERSION='+vtk.vtkVersion.GetVTKVersion())
          PY
      - name: Validar anatomia da cena e geometria do fechamento
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('scene','odyssey_v8/cave_scene.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          scene=m.Scene(160,284)
          rock,parts=scene.boulder
          assert round(rock.GetScale()[0],2)==4.30
          assert round(rock.GetScale()[2],2)==6.05
          scene.update(10.8)
          before=rock.GetPosition()
          scene.update(16.8)
          after=rock.GetPosition()
          assert before[1]>after[1]+7
          assert 8.8<after[1]<9.1
          assert not scene.giant.leftEye.GetVisibility()
          assert not scene.giant.rightEye.GetVisibility()
          assert scene.giant.oneEye.GetVisibility()
          assert after[2]-rock.GetScale()[2]<.1
          assert after[2]+rock.GetScale()[2]>=12.1
          print('PASSOU_3D_DOORWAY_OCCLUSION_AND_GIANT_IDENTITY')
          PY
      - name: Renderizar 17 segundos com personagens, camera e pedra no mesmo mundo 3D
        run: |
          mkdir -p odyssey_v8/out
          python -u odyssey_v8/cave_scene.py \
            --size 720x1280 \
            --fps 30 \
            --duration 17 \
            --stills --video \
            --output odyssey_v8/out
      - name: Verificar codificacao sem fingir aprovacao editorial
        run: |
          python - <<'PY'
          import json,subprocess
          p='odyssey_v8/out/odyssey-v8-3d-blocking-video-silent.mp4'
          raw=subprocess.check_output(['ffprobe','-v','error','-show_entries',
               'stream=width,height,r_frame_rate,codec_name:format=duration',
               '-of','json',p],text=True)
          d=json.loads(raw)
          v=next(s for s in d['streams'] if 'width' in s)
          assert (v['width'],v['height'],v['r_frame_rate'])==(720,1280,'30/1')
          assert 16.98<float(d['format']['duration'])<17.02
          print('PROTOTIPO_3D_TECNICO=pass; APROVACAO_ARTISTICA=pendente; PUBLICACAO=false')
          PY
      - name: Publicar somente artefatos de teste interno, nunca no Instagram
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ODISSEIA_V8_3D_17SEG_PROTOTIPO_NAO_PUBLICAR
          path: |
            odyssey_v8/out/*.mp4
            odyssey_v8/out/*.png
          if-no-files-found: warn
          retention-days: 7
# NOTA: o arquivo de 17s aqui é um blocking 3D silencioso a 720/30.
# A voz Rasalgethi provém do master privado, adicionada fora do GitHub.
# 4K/60 só após aprovação de narrativa e atuação, não por mero upscaling.
# Este workflow NUNCA publica, agenda ou altera a fila do Instagram.
