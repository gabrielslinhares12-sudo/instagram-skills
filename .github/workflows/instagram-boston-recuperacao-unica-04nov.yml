name: Boston 04NOV - Recuperar uma unica publicacao Meta
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-boston-recuperacao-unica-04nov.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read-only verificacao na Meta, antes de qualquer publicacao
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0,'scripts')
          from facebook_poster import FacebookPoster,FacebookConfig
          root=pathlib.Path('content/editorial/BOSTON-RECOVERY-04NOV.json')
          plan=json.loads(root.read_text(encoding='utf-8'))
          id='tue-2026-11-04-boston-1919-carrossel-imediato'
          ledger=json.loads(pathlib.Path('content/publication-state.json').read_text(encoding='utf-8'))
          entry=ledger['items'].get(id,{})
          posts=json.loads(pathlib.Path('content/schedule.json').read_text(encoding='utf-8'))['posts']
          target=[p for p in posts if p['id']==id]
          assert len(target)==1 and len(target[0]['media_urls'])==5 and target[0]['approved'] is True
          assert entry.get('status')=='needs_review' and entry.get('creation_id')=='18102820949100158'
          assert plan['status']=='authorized' and plan['attempts_remaining']==1 and plan['creation_id']==entry['creation_id']
          p=FacebookPoster(FacebookConfig.from_env())
          who=p.check_identity()
          assert who['username']=='temumaexplicacao' and who['instagram_user_id']=='17841433004716815'
          container=p._request('GET',entry['creation_id'],params={'fields':'id,status_code,status'})
          assert container.get('status_code')=='FINISHED',container
          response=p._request('GET',who['instagram_user_id']+'/media',
              params={'fields':'id,caption,permalink,timestamp,media_type','limit':80})
          media=response.get('data',[])
          matches=[x for x in media if 'Boston, 1919' in str(x.get('caption',''))
                  or ('melaço' in str(x.get('caption','')).lower() and 'boston' in str(x.get('caption','')).lower())]
          assert isinstance(media,list) and not matches, 'Boston already visible in Meta feed; abort'
          print('PRE_FLIGHT_FINISHED_NO_DUPLICATE='+json.dumps({
             'creation_id':container['id'],'status_code':container['status_code'],
             'recent_media_checked':len(media),'matches':0,'account':who['username']}))
          PY
      - name: Persistir trava de uma tentativa ANTES de POST na Meta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,datetime
          p=pathlib.Path('content/editorial/BOSTON-RECOVERY-04NOV.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          assert j['status']=='authorized' and j['attempts_remaining']==1
          j['status']='claimed'
          j['attempts_remaining']=0
          j['claimed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          j['github_run_id']='${{ github.run_id }}'
          j['github_run_attempt']='${{ github.run_attempt }}'
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/editorial/BOSTON-RECOVERY-04NOV.json
          git commit -m 'claim(instagram): consumir tentativa unica no mesmo container Boston'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Revalidar e publicar container existente UMA VEZ - sem recriar media
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,sys,datetime
          sys.path.insert(0,'scripts')
          from facebook_poster import FacebookPoster,FacebookConfig
          id='tue-2026-11-04-boston-1919-carrossel-imediato'
          ledger_path=pathlib.Path('content/publication-state.json')
          recovery_path=pathlib.Path('content/editorial/BOSTON-RECOVERY-04NOV.json')
          result_path=pathlib.Path('content/editorial/BOSTON-RECOVERY-RESULT-04NOV.json')
          ledger=json.loads(ledger_path.read_text(encoding='utf-8'))
          original=ledger['items'].get(id,{})
          claim=json.loads(recovery_path.read_text(encoding='utf-8'))
          assert claim['status']=='claimed' and claim['attempts_remaining']==0
          assert original['status']=='needs_review' and original['creation_id']==claim['creation_id']
          poster=FacebookPoster(FacebookConfig.from_env())
          account=poster.check_identity()
          assert account['instagram_user_id']=='17841433004716815'
          status=poster._request('GET',claim['creation_id'],params={'fields':'id,status_code'})
          assert status.get('status_code')=='FINISHED','Container not ready'
          media=poster._request('GET',account['instagram_user_id']+'/media',
                      params={'fields':'id,caption,permalink,timestamp,media_type','limit':80}).get('data',[])
          matches=[m for m in media if 'Boston, 1919' in str(m.get('caption',''))
               or ('melaço' in str(m.get('caption','')).lower() and 'boston' in str(m.get('caption','')).lower())]
          assert not matches,'Duplicate detected immediately before one-shot POST'
          result={'id':id,'creation_id':claim['creation_id'],'method':'one single media_publish POST reusing previously finished container',
                  'checked_duplicate_count':len(media),'status':'unconfirmed'}
          try:
              published=poster._request('POST',account['instagram_user_id']+'/media_publish',
                          data={'creation_id':claim['creation_id']})
              media_id=published.get('id')
              assert isinstance(media_id,str) and media_id.isdigit(),'Meta returned no confirmed media ID'
              result.update({'status':'published','media_id':media_id})
              try:
                  item=poster._request('GET',media_id,params={'fields':'id,permalink,media_type,timestamp,username'})
                  if item.get('id')==media_id and item.get('username')=='temumaexplicacao':
                      result['permalink']=item.get('permalink')
                      result['media_type']=item.get('media_type')
                      result['timestamp']=item.get('timestamp')
              except Exception as e:
                  result['permalink_lookup_error']=type(e).__name__
              original['status']='published'
              original['media_id']=media_id
              original['instagram_user_id']=account['instagram_user_id']
              original['username']='temumaexplicacao'
              original['published_at']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
              original['recovery_same_creation_id']=True
              if result.get('permalink'):original['permalink']=result['permalink']
              original.pop('error_type',None);original.pop('http_status',None)
              original.pop('code',None);original.pop('subcode',None)
              ledger_path.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              claim['status']='published'
              claim['media_id']=media_id
              claim['published_at']=original['published_at']
          except Exception as e:
              claim['status']='recovery_failed'
              result.update({'status':'recovery_failed','error_type':type(e).__name__,
                  'http_status':getattr(e,'http_status',None),'code':getattr(e,'code',None),
                  'subcode':getattr(e,'subcode',None)})
          result_path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          recovery_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('META_BOSTON_RECOVERY_RESULT='+json.dumps(result,ensure_ascii=False))
          PY
      - name: Salvar recibo ou bloqueio de falha sem nova tentativa
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/publication-state.json content/editorial/BOSTON-RECOVERY-04NOV.json
          if test -f content/editorial/BOSTON-RECOVERY-RESULT-04NOV.json; then
            git add content/editorial/BOSTON-RECOVERY-RESULT-04NOV.json
          fi
          if git diff --cached --quiet; then
            echo 'Sem alteracoes de recibo'; exit 0
          fi
          git commit -m 'receipt(instagram): reconciliar tentativa unica Boston com Meta'
          git pull --rebase origin main
          git push origin HEAD:main
