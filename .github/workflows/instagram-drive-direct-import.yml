name: Instagram TUE - baixar direto Google Drive e publicar Reel com Meta
# Execucao solicitada apos compartilhamento do MP4 individual em 2026-11-02.
# O publicador registra claim unico; nenhuma duplicata automatica.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-drive-direct-import.yml'

permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  import-stage-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Testar sintaxe e cliente Meta sem rede
        run: |
          python3 -m py_compile scripts/instagram_drive_direct_import.py scripts/instagram_stage_verified_reel.py scripts/instagram_publish_top_youtube_reel_once.py
          python3 -m unittest discover -s scripts -p 'test_facebook_poster.py' -v
          python3 -m unittest discover -s scripts -p 'test_meta_poster.py' -v
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -v
      - name: Instalar suporte a arquivos grandes no Drive
        run: python3 -m pip install 'gdown>=5,<6'
      - name: Garantir FFprobe instalado antes de verificar a mídia
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Baixar MP4 original do Drive com SHA-256 e ffprobe
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python3 scripts/instagram_drive_direct_import.py
      - name: Hospedar somente o arquivo validado em branch isolado
        run: python3 scripts/instagram_stage_verified_reel.py
      - name: Configurar autor do registro e evitar duplicatas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publicar uma vez pela API Meta e registrar comprovante no GitHub
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: python3 scripts/instagram_publish_top_youtube_reel_once.py
      - name: Preservar diagnostico e registro sem repetir publicacao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tue-drive-reel-audit-${{ github.run_id }}
          path: |
            output/instagram-drive-reel/import-report.json
            content/publication-state.json
          if-no-files-found: warn
          retention-days: 14
