name: TUE Lúmino — reconstruir carrossel no modelo original
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_lumino_origin_mestre01_05nov.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tue-lumino-origin-05nov-rework
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local rendering requirements
        run: python -m pip install --disable-pip-version-check --quiet pillow numpy
      - name: Validate original visual master and mascot
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          for path,expected in [
            ('content/brand/lumino-original.png','f905d801f013c2e253b8a17ae3bc1279b57022d1b805baa632f291a3b73e0c1b'),
            ('content/brand/REFERENCIA-VISUAL-OFICIAL-TUE-MESTRE-01-02NOV2026.jpg','571f7f31012e8265c784c66f68c1f5847906f02a1e533559c2ea5624551833e9'),
          ]:
            assert sha256(Path(path).read_bytes()).hexdigest()==expected,path
          print("Canonical mascot and approved visual reference hashes matched")
          PY
      - name: Render exactly six independent original-style images
        run: python scripts/render_lumino_origin_mestre01_05nov.py
      - name: Prepare review artifact (not approved and not published)
        uses: actions/upload-artifact@v4
        with:
          name: lumino-origem-05nov-MESTRE01-revisao
          path: content/media/instagram/2026-11-05/LUMINO-ORIGEM-MESTRE01-REFEITO/*
          retention-days: 7
          if-no-files-found: error
      - name: Preserve final images in repository (no Instagram publication)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/media/instagram/2026-11-05/LUMINO-ORIGEM-MESTRE01-REFEITO/
          if ! git diff --cached --quiet; then
            git commit -m "media(lumino): six editorial JPGs recut to TUE-MESTRE-01 reference; review pending"
            git push
          fi
