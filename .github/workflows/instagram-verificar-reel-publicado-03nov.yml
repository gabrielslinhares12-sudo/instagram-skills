name: Conferir permalink Meta Reel Defesa Civil 03NOV
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-verificar-reel-publicado-03nov.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Conferir recibo no ledger e consultar permalink somente GET
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0,"scripts")
          from facebook_poster import FacebookPoster, FacebookConfig
          slug="tue-2026-11-04-18-defesa-civil-alerta"
          ledger=json.loads(pathlib.Path("content/publication-state.json").read_text(encoding="utf-8"))
          record=ledger["items"].get(slug,{})
          assert record.get("status")=="published", "Não há comprovante de publicação"
          assert record.get("media_id")=="17896370313614659", "ID divergiu"
          p=FacebookPoster(FacebookConfig.from_env())
          account=p.check_identity()
          assert account["instagram_user_id"]==record["instagram_user_id"]
          media=p._request("GET",record["media_id"],
                           params={"fields":"id,permalink,media_type,timestamp,username"})
          assert media.get("id")==record["media_id"] and media.get("media_type") in ("VIDEO","REELS"),"Resolução Media ID falhou"
          assert media.get("username")=="temumaexplicacao"
          url=media.get("permalink")
          assert isinstance(url,str) and url.startswith("https://www.instagram.com/"),"Permalink Meta inválido"
          out={"id":slug,"status":"published","media_id":record["media_id"],
               "creation_id":record.get("creation_id"),"timestamp":media.get("timestamp"),
               "published_at":record["published_at"],"permalink":url,
               "username":media.get("username"),"media_type":media.get("media_type"),
               "source":"Meta Graph GET after GitHub durable publish receipt",
               "story_published":False}
          dest=pathlib.Path("content/editorial/RECIBO-REEL-DEFESA-CIVIL-03NOV.json")
          dest.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Arquivar recibo publico Meta (sem token)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/editorial/RECIBO-REEL-DEFESA-CIVIL-03NOV.json
          if git diff --cached --quiet; then
            echo 'Recibo já registrado'
          else
            git commit -m 'receipt(instagram): permalink oficial Reel Defesa Civil de 03NOV'
            git push origin HEAD:main
          fi
