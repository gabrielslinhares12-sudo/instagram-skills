name: Instagram TUE - recuperar carrossel Halloween autorizado
# One shot on this workflow file creation. No cron; no other scheduled item.
# Re-dispatched for exact original Halloween JPEG SHA verification; other QC unchanged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-halloween-recovery-2026-11-01.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  halloween_recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Testar fila, validar as oito artes e bloquear duplicatas
        run: |
          python3 -m unittest discover -s scripts -p test_instagram_queue.py -q
          python3 -m pip install 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py verify-assets
          python3 scripts/instagram_visual_standard.py audit-queue
          python3 - <<'PY'
          import json
          manifest=json.load(open('content/schedule.json'))
          state=json.load(open('content/publication-state.json'))
          found=[x for x in manifest['posts'] if x['id']=='halloween-2026-10-31-historia-8-laminas']
          assert len(found)==1
          x=found[0]
          assert x['approved'] is True and x['kind']=='carousel' and len(x['media_urls'])==8
          assert x.get('distribution_mode')=='api_carousel_then_native_music'
          assert x.get('owner_authorized_two_step_music') is True
          assert x['id'] not in state['items'], 'Carousel has receipt or claim: STOP'
          assert state['items'].get('halloween-2026-10-31-tirinha-aprovada',{}).get('status')=='published'
          assert all(not x['approved'] for x in manifest['posts'] if x['id'].startswith(('votos-', 'meme-voto-')))
          print('One approved Halloween carousel, awaiting native music afterwards.')
          PY
      - name: Preflight identidade e autorizacao de publicacao Meta (GET only)
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: temumaexplicacao
        run: python3 scripts/instagram_preflight.py
      - name: Checar se o mesmo carrossel ja esta no Instagram (GET only)
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: temumaexplicacao
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from facebook_poster import FacebookPoster, FacebookConfig
          p=next(x for x in json.load(open('content/schedule.json'))['posts'] if x['id']=='halloween-2026-10-31-historia-8-laminas')
          poster=FacebookPoster(FacebookConfig.from_env())
          identity=poster.check_identity()
          assert identity['username']=='temumaexplicacao'
          result=poster._request('GET', identity['instagram_user_id']+'/media', params={'fields':'id,caption,media_type','limit':100})
          items=result.get('data')
          if not isinstance(items,list): raise ValueError('Cannot verify existing Instagram publications.')
          if any(x.get('caption')==p['caption'] and x.get('media_type')=='CAROUSEL_ALBUM' for x in items):
              raise ValueError('Identical Halloween carousel exists on Instagram: do not republish.')
          print('Duplicate check passed in last 100 publications.')
          PY
      - name: Publicar carrossel aprovado UMA VEZ e registrar musica pendente
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: temumaexplicacao
          INSTAGRAM_SCHEDULER_ENABLED: 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/instagram_queue.py --execute
      - name: Arquivar recibo do carrossel sem segredos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halloween-recovery-ledger-${{ github.run_id }}
          path: content/publication-state.json
          if-no-files-found: ignore
          retention-days: 30
