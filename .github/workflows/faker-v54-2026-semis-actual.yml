name: "FAKER V5.4 — Riot 2026 T1 BLG semifinal real 1080p footage"
on:
  push:
    branches: [experimental/faker-ep01-openmontage-v49]
    paths: ['.github/workflows/faker-v54-2026-semis-actual.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Install FFmpeg and yt-dlp
        run: python -m pip install -q -U yt-dlp imageio-ffmpeg
      - name: Cut distinct actual 2026 semifinal frames at broadcast resolution
        run: |
          mkdir -p riot2026
          cat >/tmp/semis.py <<'PY'
          import pathlib,concurrent.futures,subprocess,json
          import imageio_ffmpeg
          src='https://kick.com/riotgames/videos/01a1b7c1-bdd0-778f-b698-11d34487a200';out=pathlib.Path('riot2026')
          times=['00:18:30','00:45:00','01:17:00','01:51:00','02:36:00','03:12:00','03:48:00','04:13:00']
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          def run(x):
            ix,a=x
            hh,mm,ss=map(int,a.split(':'));end=hh*3600+mm*60+ss+8
            b=f'{end//3600:02d}:{(end//60)%60:02d}:{end%60:02d}'
            row={'id':ix,'event':'Worlds 2026 semifinal T1 versus BLG','source_url':src,'in':a,'out':b,'rights':'Private production review only'}
            cmd=['yt-dlp','--ffmpeg-location',ff,'--no-progress','--socket-timeout','12','--retries','0','--fragment-retries','0','--download-sections',f'*{a}-{b}','--force-keyframes-at-cuts','--format','best[height>=1080]/best[height>=720]','--merge-output-format','mp4','-o',str(out/(f'2026_{ix:02d}.%(ext)s')),src]
            try:
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=145)
              f=out/(f'2026_{ix:02d}.mp4')
              if p.returncode or not f.exists() or f.stat().st_size<100000:raise RuntimeError((p.stdout+p.stderr)[-500:])
              row['status']='DOWNLOADED';row['bytes']=f.stat().st_size;row['filename']=f.name
            except Exception as e:row['status']='FAILED';row['reason']=str(e)[:400]
            print(ix,row['status'],row.get('bytes'),flush=True)
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:res=list(ex.map(run,enumerate(times)))
          (out/'2026_WORLD_SEMIFINAL_PROVENANCE.json').write_text(json.dumps(res,ensure_ascii=False,indent=2))
          PY
          python /tmp/semis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faker-v54-real-2026-blg-t1-1080p
          path: riot2026/
          retention-days: 5
          compression-level: 0
