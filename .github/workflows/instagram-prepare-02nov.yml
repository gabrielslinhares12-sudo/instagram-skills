name: Preparar JPEGs das publicações TUE de 02/11

# As imagens PNG aprovadas ficam no repositório, mas a API Meta exige JPEG.
# Preparação, não postagem: o agendamento real continua em instagram-scheduler.yml.
on:
  push:
    branches: [main]
    paths:
      - 'content/staging/2026-11-02-meta/*.png'
      - '.github/workflows/instagram-prepare-02nov.yml'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-preparation-2026-11-02
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Converter PNG canônico para JPEG público Meta
        run: |
          python -m pip install 'Pillow>=11,<13'
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from PIL import Image
          source = Path('content/staging/2026-11-02-meta')
          destination = Path('content/media/2026-11-02-meta')
          destination.mkdir(parents=True, exist_ok=True)
          expected = [f'mar-cruzado-{i:02}.png' for i in range(1,6)] + ['sac-senha-impossivel.png']
          if not all((source / name).is_file() for name in expected):
              print('Mídias de origem incompletas: preservando fila sem publicação')
              raise SystemExit(0)
          evidence = []
          for name in expected:
              im = Image.open(source / name).convert('RGB')
              if abs(im.width/im.height - 0.8) > 0.005:
                  raise ValueError(f'Formato 4:5 inválido: {name}')
              final = destination / (name[:-4] + '.jpg')
              im = im.resize((1080,1350),Image.Resampling.LANCZOS)
              im.save(final,format='JPEG',quality=91,optimize=True,subsampling=0)
              evidence.append({'name':final.name,'sha256':hashlib.sha256(final.read_bytes()).hexdigest(),'bytes':final.stat().st_size})
          (destination / 'jpegs-manifest.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False))
          PY
      - name: Persistir JPEGs e manifesto sem alterar fila operacional
        run: |
          if [ ! -f content/media/2026-11-02-meta/jpegs-manifest.json ]; then
            echo 'Mídias incompletas. Nada a enviar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/media/2026-11-02-meta
          if git diff --cached --quiet; then
            echo 'JPEGs já convertidos'
          else
            git commit -m 'media(instagram): publicar JPEGs TUE 02nov para Meta Graph API'
            git push origin HEAD:main
          fi
