name: Odisseia 07NOV — atuação Ítaca v4 4K60 (sem publicação)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/odisseia-gait-06nov-qc.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odisseia-itaca-v4-qc
  cancel-in-progress: false
jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6dda1de59763e9a5d684684cff531521c6b1ac19
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Instalar dependencias gratuitas
        run: npm ci --no-audit --no-fund
      - name: Validar compilacao e testes de atuacao
        run: npm run check
      - name: Renderizar 12s reencenados em 4K real e 60 FPS
        run: |
          npm run prepare-assets
          npx remotion render src/index.ts OdysseyHomeQC out/odisseia-retorno-personagens-12s-4k60-qc-v4.mp4 --scale=2 --codec=h264 --crf=17 --concurrency=2
      - name: Auditar arquivo sem apt-get usando ferramentas Remotion
        shell: bash
        run: |
          set -euo pipefail
          MP4="out/odisseia-retorno-personagens-12s-4k60-qc-v4.mp4"
          FFMPEG="$(find node_modules/@remotion -type f -name ffmpeg -print -quit)"
          FFPROBE="$(find node_modules/@remotion -type f -name ffprobe -print -quit)"
          test -x "$FFMPEG" && test -x "$FFPROBE"
          "$FFPROBE" -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of json "$MP4" > out/odisseia-itaca-v4-tech-qc.json
          python3 - <<'PY'
          import json,pathlib
          file=pathlib.Path('out/odisseia-retorno-personagens-12s-4k60-qc-v4.mp4')
          info=json.loads(pathlib.Path('out/odisseia-itaca-v4-tech-qc.json').read_text())
          v=next(x for x in info['streams'] if 'width' in x)
          assert v['codec_name']=='h264',v
          assert (v['width'],v['height'],v['r_frame_rate'])==(2160,3840,'60/1'),v
          assert abs(float(info['format']['duration'])-12)<.1
          assert file.stat().st_size>1_000_000
          print('QC_MP4_12S_4K60_V4_VALIDADO_SEM_PUBLICAR')
          PY
          for stamp in 0.8 2 3.5 4.6 6 7.5 8.6 10 11.3; do
            "$FFMPEG" -v error -ss "$stamp" -i "$MP4" -frames:v 1 -vf scale=540:960 -y "out/odisseia-itaca-v4-frame-${stamp}s.jpg"
          done
      - name: Arquivar MP4 corrigido, evidencias e quadros visuais
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: odisseia-itaca-12s-atuacao-v4-4K60-QC
          path: |
            motion/out/odisseia-retorno-personagens-12s-4k60-qc-v4.mp4
            motion/out/odisseia-itaca-v4-tech-qc.json
            motion/out/odisseia-itaca-v4-frame-*.jpg
          retention-days: 7
          if-no-files-found: error
# V4: figurino civil sem armadura, maos alinhadas e tentativa de abraco em close. Revisao editorial obrigatoria.
# Esta rotina nao publica, agenda ou substitui os episodios integrais.
