name: TUE - recuperar Shorts do proprio canal com Deno (download e QC)
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Dia do Reel em America/Sao_Paulo, YYYY-MM-DD"
        required: false
        default: "2026-11-02"
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-youtube-multiclient.yml'
      - 'scripts/instagram_youtube_multi_client.py'
permissions:
  contents: read
concurrency:
  group: instagram-tue-youtube-multiclient
  cancel-in-progress: false
jobs:
  import-original:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Obter repositorio sem credenciais de outros canais
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar Deno para desafios JavaScript do YouTube
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalar yt-dlp + EJS
        run: python -m pip install --upgrade "yt-dlp[default]" yt-dlp-ejs
      - name: Verificar dependencias
        run: |
          deno --version
          python -m yt_dlp --version
          ffprobe -version | head -n 1
      - name: Testar clientes e validar arquivo original sem publicar
        run: python scripts/instagram_youtube_multi_client.py --day 2026-11-02
      - name: Arquivar somente arquivos gerados e relatorio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tue-short-yt-dlp-deno
          path: output/youtube-reel-import/
          if-no-files-found: warn
          retention-days: 7
