name: TUE Troia 05NOV - preflight leitura Meta sem publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tue-05nov-troia-preflight-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
      INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validar integridade exata e fila em dry-run
        run: |
          python3 -m pip install -q 'Pillow>=11,<13'
          python3 scripts/instagram_visual_standard.py audit-queue
          python3 scripts/instagram_queue.py --dry-run
      - name: Confirmar permissao Meta com operacoes GET somente
        run: python3 scripts/instagram_preflight.py
