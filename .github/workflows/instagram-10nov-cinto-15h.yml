name: "Instagram TUE — Cinto e Airbag 10nov 15h (publicação única)"
on:
  push:
    branches: [main]
    paths: [".github/workflows/instagram-10nov-cinto-15h.yml"]
  # V9 corrigida e expressamente autorizada pelo proprietário para 15h BRT.
  schedule:
    - cron: "1,4,7,12,20,30,40 18 10 11 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false
jobs:
  cinto-15h:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTAGRAM_SCHEDULER_ENABLED: "true"
      INSTAGRAM_USERNAME: "temumaexplicacao"
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
    steps:
      - name: Checkout and preserve durable publication state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact target and time; never publish on setup push
        id: gate
        run: |
          python3 - <<'PY'
          import json,os,datetime
          from pathlib import Path
          post_id="tue-2026-11-10-15-cinto-airbag-v9-corrigido"
          posts=json.loads(Path("content/schedule.json").read_text())["posts"]
          found=[p for p in posts if p.get("id")==post_id]
          assert len(found)==1
          p=found[0]
          assert p["approved"] is True and p["kind"]=="carousel"
          assert p["due_at"]=="2026-11-10T18:00:00Z" and len(p["media_urls"])==5
          assert p["target_url"]=="https://www.instagram.com/temumaexplicacao/"
          now=datetime.datetime.now(datetime.timezone.utc)
          publishing=(os.getenv("GITHUB_EVENT_NAME")=="schedule" and
              datetime.datetime(2026,11,10,18,tzinfo=datetime.timezone.utc)<=now<
              datetime.datetime(2026,11,10,20,tzinfo=datetime.timezone.utc))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("publish="+str(publishing).lower()+"\n")
          print("CINTO_15H_SCHEDULED="+p["due_at"])
          print("CINTO_15H_EVENT="+os.getenv("GITHUB_EVENT_NAME",""))
          print("CINTO_15H_PUBLICATION_GATE="+str(publishing).lower())
          PY
      - name: Test exact five JPEGs and pinned media hashes
        run: |
          python3 -m pip -q install "Pillow>=11,<13"
          python3 - <<'PY'
          import json,hashlib,urllib.request
          from PIL import Image
          from pathlib import Path
          post=next(p for p in json.loads(Path("content/schedule.json").read_text())["posts"] if p["id"]=="tue-2026-11-10-15-cinto-airbag-v9-corrigido")
          for i,(url,sha) in enumerate(zip(post["media_urls"],post["media_sha256"]),1):
              p=Path(f"content/media/instagram/2026-11-10/cinto-airbag-15h-v9/{i:02d}.jpg")
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
              with Image.open(p) as im: assert im.size==(1080,1350) and im.format=="JPEG"
              with urllib.request.urlopen(urllib.request.Request(url,method="GET",headers={"User-Agent":"InstagramTUE/1.0"}),timeout=35) as r:
                  data=r.read()
              assert hashlib.sha256(data).hexdigest()==sha, "META_MEDIA_URL_NOT_PUBLIC_OR_HASH_MISMATCH"
          print("MEDIA_PUBLIC_HTTPS_5_SHA256_VERIFIED")
          PY
      - name: Dry-run Instagram queue and assert corrected 15h carousel is visible
        run: |
          python3 scripts/instagram_queue.py --dry-run > /tmp/ig-cinto15-plan.json
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/ig-cinto15-plan.json"))
          p=next(p for p in x["items"] if p["id"]=="tue-2026-11-10-15-cinto-airbag-v9-corrigido")
          assert p["status"] in ("future","due","published")
          print("QUEUE_CINTO_STATUS="+p["status"])
          PY
      - name: Verify Meta account and token for 15h
        run: python3 scripts/instagram_preflight.py
      - name: Configure durable claim before publishing
        if: steps.gate.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish corrected 15h Cinto and Airbag carousel once
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -o pipefail
          python3 scripts/instagram_queue.py --execute | tee /tmp/tue-cinto15-result.json
          python3 - <<'PY'
          import json
          j=json.load(open("/tmp/tue-cinto15-result.json"))
          if j.get("status")=="published" and j.get("item_id")=="tue-2026-11-10-15-cinto-airbag-v9-corrigido":
              print("CINTO_MEDIA_PUBLISHED="+j["media_id"])
          elif j.get("status")=="needs_review":
              raise SystemExit("CINTO_POST_OUTCOME_UNCONFIRMED_INSPECT_META_LEDGER_NO_AUTO_RETRY")
          else:
              print("CINTO_NO_PUBLICATION_THIS_RUN_CHECK_PRIOR_CLAIM")
          PY
      - name: Confirm permalink from Meta receipt
        if: steps.gate.outputs.publish == 'true'
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          import json
          from facebook_poster import FacebookPoster,FacebookConfig
          from pathlib import Path
          state=json.loads(Path("content/publication-state.json").read_text())
          p=state["items"].get("tue-2026-11-10-15-cinto-airbag-v9-corrigido",{})
          assert p.get("status")=="published" and p.get("media_id"),"CINTO_NOT_CONFIRMED_PUBLISHED"
          poster=FacebookPoster(FacebookConfig.from_env())
          x=poster._request("GET",p["media_id"],params={"fields":"id,permalink,media_type"},timeout=40)
          assert str(x.get("id"))==str(p["media_id"]) and x.get("permalink"),"META_PERMALINK_MISSING"
          print("CINTO_INSTAGRAM_PERMALINK="+x["permalink"])
          PY
