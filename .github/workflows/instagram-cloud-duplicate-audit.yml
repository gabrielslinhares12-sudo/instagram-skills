name: Instagram TUE - auditoria de duplicata Halloween (somente leitura)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-cloud-duplicate-audit.yml'
      - 'scripts/instagram_cloud_duplicate_audit.py'
permissions:
  contents: read
jobs:
  read_only_duplicate_check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Buscar histórico recente da conta sem publicar
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: python3 scripts/instagram_cloud_duplicate_audit.py
