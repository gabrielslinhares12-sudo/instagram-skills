name: "FAKER EP01 — 2026 Cheongnyong real ceremony source QC"
on:
  push:
    branches: [experimental/faker-ep01-openmontage-v49]
    paths: ['.github/workflows/faker-2026-cheongnyong-v52.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  ceremony:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract private editorial sample
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -U yt-dlp
          mkdir -p source
          set +e
          timeout 120 yt-dlp --no-playlist --no-progress --socket-timeout 12 --retries 0 --fragment-retries 0 --download-sections '*00:00:01-00:00:11' --force-keyframes-at-cuts -f 'best[height<=720]/best' --merge-output-format mp4 -o 'source/cheongnyong2026.%(ext)s' 'https://www.dailymotion.com/video/x9wxhhs' > source/source_log.txt 2>&1
          echo $? >source/status_code
          find source -type f -printf '%p %s\n' >source/files.txt
          echo 'Source https://www.dailymotion.com/video/x9wxhhs - 2026 ceremony - rights pending, PRIVATE QC ONLY' >source/provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faker-2026-cheongnyong-QC-private
          path: source/
          retention-days: 3
          compression-level: 0
