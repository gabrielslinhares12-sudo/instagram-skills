name: Instagram TUE - publicar uma pauta por dia (31out a 06nov 2026)
on:
  schedule:
    - cron: '7 15 31 10 *'
    - cron: '7 15 1-6 11 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Apenas mostrar a publicacao prevista; nao publicar'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
concurrency:
  group: instagram-temumaexplicacao-publication
  cancel-in-progress: false

jobs:
  one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verificar somente a data autorizada do lote (UTC)
        id: gate
        shell: bash
        run: |
          DAY="$(date -u +%F)"
          case "$DAY" in
            2026-10-31|2026-11-01|2026-11-02|2026-11-03|2026-11-04|2026-11-05|2026-11-06)
              if [ "${{ github.event_name }}" = "schedule" ]; then
                echo "allowed=true" >> "$GITHUB_OUTPUT"
                echo "Lote autorizado; uma unica publicacao devida para $DAY"
              else
                echo "allowed=false" >> "$GITHUB_OUTPUT"
                echo "Disparo manual seguro: nao publica"
              fi
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "Fora das sete datas autorizadas; nada a executar"
              ;;
          esac

      - name: Carregar fila final e recibos oficiais
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Validar o contrato de um post por dia
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          python3 -m unittest discover -s scripts -p 'test_instagram_queue.py' -q
          python3 -m unittest discover -s scripts -p 'test_instagram_preflight.py' -q
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          d=datetime.now(timezone.utc).date().isoformat()
          posts=json.loads(Path('content/schedule.json').read_text('utf-8'))['posts']
          eligible=[p for p in posts if p['due_at'][:10]==d]
          assert len(eligible)==1 and eligible[0]['approved'] is True
          assert eligible[0]['username']=='temumaexplicacao'
          assert eligible[0]['due_at']==d+'T15:00:00Z'
          assert len(eligible[0]['media_urls'])==len(eligible[0]['media_sha256'])
          print('ONLY_ONE_APPROVED_EXACT_DAY_SLOT='+eligible[0]['id'])
          PY

      - name: Conferir identidade e permissoes da Meta sem publicar
        if: steps.gate.outputs.allowed == 'true'
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: python3 scripts/instagram_preflight.py

      - name: Publicar exclusivamente o post devido e gravar media_id imutavel
        if: steps.gate.outputs.allowed == 'true'
        env:
          INSTAGRAM_SCHEDULER_ENABLED: ${{ vars.INSTAGRAM_SCHEDULER_ENABLED || 'true' }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: python3 scripts/instagram_queue.py --execute

      - name: Confirmar o recibo local apos tentativa de envio
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          day=datetime.now(timezone.utc).date().isoformat()
          data=json.loads(Path('content/schedule.json').read_text('utf-8'))
          item=next(p for p in data['posts'] if p['due_at'][:10]==day)
          state=json.loads(Path('content/publication-state.json').read_text('utf-8'))['items']
          rec=state.get(item['id']) or {}
          assert rec.get('status')=='published' and str(rec.get('media_id','')).isdigit(), 'NATIVE_INSTAGRAM_PUBLICATION_NOT_VERIFIED'
          print('INSTAGRAM_PUBLISHED_ID='+item['id'])
          print('INSTAGRAM_MEDIA_ID='+rec['media_id'])
          PY

      - name: Remover gatilhos datados ao terminar a campanha (sem checks futuros)
        if: always() && steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          if [ "$(date -u +%F)" != "2026-11-06" ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/instagram-week-publish-2026.yml')
          source=p.read_text('utf-8')
          old="  schedule:\n    - cron: '7 15 31 10 *'\n    - cron: '7 15 1-6 11 *'\n"
          assert old in source
          p.write_text(source.replace(old,''),'utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/instagram-week-publish-2026.yml
          git commit -m "Disable one-time Instagram 2026 week publishing schedule"
          git pull --rebase origin main
          git push origin HEAD:main
