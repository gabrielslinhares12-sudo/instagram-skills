name: Instagram TUE - verificar app oficial no Android GitHub
on:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram_android_official_app_preflight.py'
      - 'scripts/test_instagram_android_official_app_preflight.py'
      - '.github/workflows/instagram-android-official-app-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instagram-android-official-app-preflight
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline safety tests
        run: python3 -m unittest discover -s scripts -p 'test_instagram_android_official_app_preflight.py' -v
  emulator:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Try official Play Store without user login or content writes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/instagram_android_official_app_preflight.py
      - name: Save non-sensitive status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instagram-android-official-app-readiness
          path: cloud-probe/official-instagram-preflight/result.json
          if-no-files-found: ignore
          retention-days: 3
