name: Instagram TUE - diagnostico Meta somente leitura
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-meta-readonly-preflight.yml'
permissions:
  contents: read
jobs:
  read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Diagnosticar token e permissoes sem POST nem ID em logs
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          python3 - <<'PY'
          import os
          print("TOKEN_CONFIGURED="+str(bool(os.environ.get("FACEBOOK_USER_ACCESS_TOKEN"))).lower(),flush=True)
          print("PAGE_ID_CONFIGURED="+str(bool(os.environ.get("FACEBOOK_PAGE_ID"))).lower(),flush=True)
          print("IG_ID_CONFIGURED="+str(bool(os.environ.get("FACEBOOK_INSTAGRAM_USER_ID"))).lower(),flush=True)
          if not os.environ.get("FACEBOOK_USER_ACCESS_TOKEN"):
              print("META_PREFLIGHT=blocked_missing_user_token")
              raise SystemExit(0)
          try:
              from instagram_preflight import check
              from facebook_poster import FacebookConfig, FacebookPoster
              from meta_poster import MetaError
              result=check(FacebookPoster(FacebookConfig.from_env()))
              print("META_PREFLIGHT="+("passed" if result.get("ok") else "failed"),flush=True)
              print("MISSING_PERMISSIONS="+",".join(result.get("missing_permissions",[])),flush=True)
              print("PUBLISHING_ATTEMPTED=false",flush=True)
          except Exception as error:
              print("META_PREFLIGHT=failed",flush=True)
              print("ERROR_TYPE="+type(error).__name__,flush=True)
              code=getattr(error,"code",None)
              if code is not None:
                  print("META_ERROR_CODE="+str(code)[:8],flush=True)
              print("PUBLISHING_ATTEMPTED=false",flush=True)
          PY
        shell: bash
        working-directory: scripts

# 06NOV Odyssey readiness: GET-only preflight; no publish actions or secrets in logs.
