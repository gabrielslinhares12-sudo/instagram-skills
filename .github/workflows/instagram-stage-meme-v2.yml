name: Preparar meme do voto — sem publicação
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-stage-meme-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-tue-media-staging
  cancel-in-progress: false
jobs:
  normalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Normalizar arte para 1080x1350 com texto integral
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source=Path('content/staging/2026-11-01/meme-voto-branco-nulo-v2-source.png')
          target=Path('content/staging/2026-11-01/meme-voto-branco-nulo-v2-final.jpg')
          assert source.exists(), source
          original=Image.open(source).convert('RGB')
          scaled=ImageOps.contain(original,(1080,1350),Image.Resampling.LANCZOS)
          background=Image.new('RGB',(1080,1350),(6,12,20))
          background.paste(scaled,((1080-scaled.width)//2,(1350-scaled.height)//2))
          background.save(target,'JPEG',quality=94,optimize=True,subsampling=0)
          check=Image.open(target)
          assert check.size==(1080,1350)
          print('meme exported',target,check.size,target.stat().st_size)
          PY
      - name: Registrar somente o JPEG final como rascunho
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/staging/2026-11-01/meme-voto-branco-nulo-v2-final.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize four-panel voting meme for Instagram review'
            git push origin HEAD:main
          else
            echo 'Already normalized.'
          fi
