name: Reconciliar Boston Meta sem reenviar - 04NOV
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-reconciliar-boston-04nov.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-boston-read-only-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Consultar container recusado e publicações recentes (GET ONLY)
        env:
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_INSTAGRAM_USER_ID: ${{ vars.FACEBOOK_INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME || 'temumaexplicacao' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,sys,datetime
          sys.path.insert(0,'scripts')
          from facebook_poster import FacebookPoster,FacebookConfig
          slug='tue-2026-11-04-boston-1919-carrossel-imediato'
          ledger=json.loads(pathlib.Path('content/publication-state.json').read_text(encoding='utf-8'))
          item=ledger['items'].get(slug,{})
          assert item.get('status')=='needs_review' and item.get('creation_id')=='18102820949100158', 'Ledger changed: avoid duplicate'
          poster=FacebookPoster(FacebookConfig.from_env())
          identity=poster.check_identity()
          assert identity['instagram_user_id']=='17841433004716815'
          report={'id':slug,'time_checked':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'ledger_status':item['status'],'creation_id':item['creation_id'],
                  'media_publish_retry_allowed':False,'instagram_user_id':identity['instagram_user_id'],
                  'source':'Read-only GET against official Meta Graph API; no POST'}
          try:
              c=poster._request('GET',item['creation_id'],params={'fields':'id,status_code,status'})
              report['container']={k:c.get(k) for k in ('id','status_code','status')}
          except Exception as err:
              report['container']={'error_type':type(err).__name__,'error_code':getattr(err,'code',None),
                                   'error_subcode':getattr(err,'subcode',None)}
          try:
              media=poster._request('GET',identity['instagram_user_id']+'/media',
                   params={'fields':'id,caption,permalink,timestamp,media_type','limit':50})
              records=media.get('data',[])
              matches=[]
              for m in records:
                  cap=str(m.get('caption',''))
                  if 'Boston, 1919' in cap or ('melaço' in cap.lower() and 'boston' in cap.lower()):
                      matches.append({'id':m.get('id'),'permalink':m.get('permalink'),
                            'timestamp':m.get('timestamp'),'media_type':m.get('media_type'),
                            'caption_matches_target':True})
              report['recent_media_count']=len(records)
              report['boston_matches']=matches
          except Exception as err:
              report['media_lookup']={'error_type':type(err).__name__,
                      'error_code':getattr(err,'code',None),'error_subcode':getattr(err,'subcode',None)}
          dest=pathlib.Path('content/editorial/RECONCILIACAO-BOSTON-04NOV.json')
          dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('META_READ_ONLY_RECONCILE='+json.dumps(report,ensure_ascii=False))
          PY
      - name: Arquivar comprovante seguro sem mudar ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/editorial/RECONCILIACAO-BOSTON-04NOV.json
          git commit -m 'receipt(instagram): verificar container e duplicidade Boston após erro de mídia'
          git pull --rebase origin main
          git push origin HEAD:main
