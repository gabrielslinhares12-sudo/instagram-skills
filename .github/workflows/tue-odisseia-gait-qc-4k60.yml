name: Odisseia — QC de caminhada e animacao 4K60 (sem publicar)
on:
  push:
    branches: ['feat/tue-motion-base']
    paths:
      - 'motion/src/OdysseyGaitQC.tsx'
      - 'motion/src/actors/gait.ts'
      - 'motion/src/actors/OdysseusActor.tsx'
      - 'motion/src/Root.tsx'
      - '.github/workflows/tue-odisseia-gait-qc-4k60.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: odyssey-4k-gait-review-branch
  cancel-in-progress: true
jobs:
  validate-and-render:
    if: github.ref == 'refs/heads/feat/tue-motion-base'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/tue-motion-base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Rodar testes de anatomia e estabilidade dos pes
        run: npm run check
      - name: Usar FFmpeg e FFprobe embarcados no Remotion 4 sem apt-get
        run: |
          FFMPEG="$(find node_modules/@remotion -type f -name ffmpeg -print -quit)"
          FFPROBE="$(find node_modules/@remotion -type f -name ffprobe -print -quit)"
          test -n "$FFMPEG" && test -x "$FFMPEG"
          test -n "$FFPROBE" && test -x "$FFPROBE"
          echo "FFMPEG_BIN=$FFMPEG" >> "$GITHUB_ENV"
          echo "FFPROBE_BIN=$FFPROBE" >> "$GITHUB_ENV"
      - name: Renderizar 14s nativos em 2160x3840 60FPS
        run: |
          mkdir -p out
          npx remotion render src/index.ts OdysseyGaitQC out/OdysseyGaitQC_14s_4K60.mp4 --scale=2 --codec=h264 --crf=17 --concurrency=2
      - name: Extrair quatro quadros para revisao visual, sem recomprimir o master
        run: |
          for stamp in 1 4 8 11; do
            "$FFMPEG_BIN" -v error -ss "$stamp" -i out/OdysseyGaitQC_14s_4K60.mp4 -frames:v 1 -y "out/qc_frame_${stamp}s.png"
          done
      - name: Validar formato do master do teste
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          path='out/OdysseyGaitQC_14s_4K60.mp4'
          raw=subprocess.check_output([os.environ['FFPROBE_BIN'],'-v','error','-of','json','-show_entries','stream=codec_type,codec_name,width,height,r_frame_rate:format=duration',path])
          info=json.loads(raw)
          video=next(x for x in info['streams'] if x['codec_type']=='video')
          assert video['width']==2160 and video['height']==3840,video
          assert video['r_frame_rate']=='60/1',video
          assert video['codec_name']=='h264',video
          assert abs(float(info['format']['duration'])-14)<.1,info['format']
          print('ODYSSEY_WALK_QC_4K60_RENDER_VERIFIED_NOT_PUBLISHED')
          PY
      - name: Expor MP4 e frames para revisao, nao publicar
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: odisseia-caminhada-qc-4k60-${{ github.run_id }}
          path: |
            motion/out/OdysseyGaitQC_14s_4K60.mp4
            motion/out/qc_frame_*.png
          if-no-files-found: warn
          retention-days: 7
