name: "FAKER EP01 — ingest verified CC archives (PRIVATE)"
on:
  push:
    branches: [experimental/faker-ep01-openmontage-v49]
    paths: ['.github/workflows/faker-ep01-commons-ingest.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  commons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Download Creative Commons source video and portrait originals
        shell: bash
        run: |
          mkdir -p footage_commons
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,time,pathlib
          files={
            '2020_faker_interview.webm':"'페이커' 이상혁, 이제 아침을 먹겠습니다 .webm",
            '2013_faker.jpg':"Faker (Lee Sang-hyeok) at LoL World Championship 2013.jpg",
            '2015_faker.jpg':"Faker at 2015 Worlds.jpeg",
            '2015_faker_cup.jpg':"Faker at 2015 Worlds with Summoners Cup.jpeg",
            '2023_faker_msi.jpg':"Faker at 2023 MSI (cropped).jpg",
            '2023_faker_trophy.jpg':"T1 hold 2023 Summoners Cup.jpg",
            '2024_faker.jpg':"Faker at Worlds 2024.jpg",
            '2024_hall_faker.jpg':"Faker Hall of Legends Press Conference - 01.jpg",
          }
          base=pathlib.Path('footage_commons')
          ua={'User-Agent':'TUE-Documentary-CC-Media-Collector/0.9 (portfolio prototype; Wikimedia API metadata)'}
          receipts=[]
          for output,title in files.items():
            try:
              api='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','formatversion':'2','prop':'imageinfo','iiprop':'url|size|extmetadata','titles':'File:'+title})
              rq=urllib.request.Request(api,headers=ua)
              with urllib.request.urlopen(rq,timeout=30) as response: j=json.load(response)
              page=j['query']['pages'][0];info=page['imageinfo'][0]
              m=info.get('extmetadata',{})
              lic=(m.get('LicenseShortName') or {}).get('value','')
              rec={'name':output,'title':title,'license':lic,'source_page':'https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(title.replace(' ','_')),'source_width':info.get('width'),'source_height':info.get('height'),'size':info.get('size')}
              if not ('cc' in lic.lower() or 'public' in lic.lower()):
                rec['status']='REJECTED_NO_VERIFIED_CC_LICENSE';receipts.append(rec);continue
              if output.lower().endswith(('.jpg','.jpeg','.png')) and info.get('width',0)>=info.get('height',0):
                rec['status']='REJECTED_LANDSCAPE_STILL';receipts.append(rec);continue
              url=info['url'];rq=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(rq,timeout=120) as f, open(base/output,'wb') as dest:
                while True:
                  chunk=f.read(1024*1024)
                  if not chunk:break
                  dest.write(chunk)
              rec['sha256']=hashlib.sha256((base/output).read_bytes()).hexdigest()
              rec['saved_bytes']=(base/output).stat().st_size
              rec['status']='DOWNLOADED_FOR_PRIVATE_REVIEW'
              receipts.append(rec);print('OK',output,rec['saved_bytes'],lic,flush=True)
            except Exception as e:
              receipts.append({'name':output,'title':title,'status':'FAILED','reason':str(e)})
              print('FAIL',output,str(e)[:300],flush=True)
          (base/'PROVENANCE.json').write_text(json.dumps(receipts,ensure_ascii=False,indent=2))
          PY
      - name: Upload archive originals and provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faker-cc-archive-originals
          path: footage_commons/
          compression-level: 0
          retention-days: 5
